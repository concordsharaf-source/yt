<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الدردشة - قناة اليمن اليوم</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#202c33">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="images/icon-192x192.png">
    <script src="firebase-app.js"></script>
    <script src="firebase-database.js"></script>
    <script src="firebase-storage.js"></script>
    <script src="config.js"></script>
    <script src="push.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(function(reg) {
                    function check() { reg.update().catch(function() {}); }
                    check();
                    setInterval(check, 30000);
                    document.addEventListener('visibilitychange', function() {
                        if (document.visibilityState === 'visible') check();
                    });
                    if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                    reg.addEventListener('updatefound', function() {
                        var nw = reg.installing;
                        if (!nw) return;
                        nw.addEventListener('statechange', function() {
                            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                                nw.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                }).catch(function() {});
                var refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', function() {
                    if (refreshing) return;
                    refreshing = true;
                    window.location.reload();
                });
            });
        }
    </script>
    <style>
        @import url('fonts.css');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: #0b141a;
            height: 100dvh;
            overflow: hidden;
            color: #e9edef;
        }
        .chat-wrapper {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            max-width: 720px;
            margin: 0 auto;
            position: relative;
            background: #0b141a;
        }

        .chat-header {
            background: #202c33;
            color: #e9edef;
            padding: 8px 10px;
            padding-top: calc(8px + env(safe-area-inset-top, 0px));
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            z-index: 40;
            min-height: 58px;
        }
        .back-arrow {
            background: none; border: none; color: #e9edef;
            font-size: 1.35rem; cursor: pointer; padding: 6px 8px;
            font-family: inherit;
        }
        .header-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; color: #fff; flex-shrink: 0;
        }
        .header-meta { flex: 1; min-width: 0; }
        .header-title { font-size: 1.05rem; font-weight: 700; line-height: 1.2; }
        .header-sub { font-size: 0.72rem; color: #8696a0; }
        .connection-dot {
            width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
            display: inline-block;
            box-shadow: 0 0 10px currentColor;
            margin: 0 6px;
        }
        .connection-dot.online { background: #22c55e; color: #22c55e; }
        .connection-dot.offline { background: #ef4444; color: #ef4444; }
        .header-avatar img, .msg-avatar img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 10px 8px 14px;
            min-height: 0;
            background-color: #0b141a;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.03) 0 1px, transparent 1px),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.025) 0 1px, transparent 1px);
            background-size: 18px 18px, 22px 22px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            -webkit-overflow-scrolling: touch;
        }

        .message-row {
            display: flex;
            gap: 6px;
            max-width: 88%;
            margin: 1px 4px;
            position: relative;
            transition: transform 0.15s ease;
        }
        .message-row.sent { align-self: flex-end; flex-direction: row-reverse; }
        .message-row.received { align-self: flex-start; }
        .message-row.highlight .msg-bubble { box-shadow: 0 0 0 2px #25d366; }
        .msg-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; color: #fff; font-size: 0.8rem;
            flex-shrink: 0; align-self: flex-end; margin-bottom: 2px;
            overflow: hidden; background: #374151;
        }
        .msg-content { display: flex; flex-direction: column; min-width: 80px; max-width: 100%; }
        .msg-sender-name { font-size: 0.78rem; font-weight: 700; margin: 0 8px 2px; }
        .msg-bubble {
            position: relative;
            padding: 6px 8px 4px 10px;
            border-radius: 8px;
            word-wrap: break-word;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
        }
        .sent .msg-bubble {
            background: #005c4b;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 2px;
        }
        .received .msg-bubble {
            background: #202c33;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
            border-bottom-left-radius: 2px;
        }
        .msg-text { font-size: 0.95rem; line-height: 1.45; white-space: pre-wrap; color: #e9edef; }
        .msg-text.edited-mark::after { content: ' (تم التعديل)'; font-size: 0.7rem; color: #8696a0; }
        .msg-image { max-width: 220px; width: 100%; border-radius: 6px; cursor: pointer; display: block; margin: 2px 0 4px; }
        .msg-meta {
            display: flex; align-items: center; justify-content: flex-end;
            gap: 4px; margin-top: 2px; user-select: none;
        }
        .msg-time { font-size: 0.68rem; color: #8696a0; }
        .msg-ticks { font-size: 0.85rem; color: #53bdeb; letter-spacing: -2px; }
        .received .msg-ticks { display: none; }

        .quote {
            display: flex; gap: 0; margin: 0 0 6px;
            background: rgba(0,0,0,0.18);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
        }
        .quote-bar { width: 4px; flex-shrink: 0; background: #25d366; }
        .quote-body { padding: 6px 8px; min-width: 0; }
        .quote-name { font-size: 0.75rem; font-weight: 700; color: #25d366; }
        .quote-text {
            font-size: 0.78rem; color: #8696a0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px;
        }

        .reactions-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; padding: 0 4px; }
        .reaction-chip {
            background: #182229; border: 1px solid #2a3942; border-radius: 12px;
            padding: 1px 7px; font-size: 0.78rem; cursor: pointer; color: #e9edef;
        }
        .reaction-chip.active { background: #005c4b; border-color: #25d366; }

        .composer {
            background: #202c33;
            padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px));
            flex-shrink: 0;
            z-index: 30;
        }
        .reply-preview {
            display: none;
            align-items: stretch;
            background: #1d282f;
            border-radius: 8px 8px 0 0;
            margin: 0 48px 0 48px;
            overflow: hidden;
        }
        .reply-preview.show { display: flex; }
        .reply-preview .quote-bar { width: 4px; background: #25d366; }
        .reply-preview-body { flex: 1; padding: 6px 10px; min-width: 0; }
        .reply-preview-name { font-size: 0.78rem; font-weight: 700; color: #25d366; }
        .reply-preview-text { font-size: 0.78rem; color: #8696a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .reply-close {
            background: none; border: none; color: #8696a0; font-size: 1.1rem;
            padding: 0 10px; cursor: pointer;
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 6px;
        }
        .attach-btn, .emoji-btn, .send-btn, .mic-btn {
            width: 44px; height: 44px; border-radius: 50%;
            border: none; cursor: pointer; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem; background: transparent; color: #8696a0;
        }
        .pill {
            flex: 1; min-width: 0;
            background: #2a3942;
            border-radius: 24px;
            display: flex; align-items: flex-end;
            padding: 4px 4px 4px 6px;
            min-height: 44px;
        }
        .pill textarea {
            flex: 1; min-width: 0;
            border: none; outline: none; resize: none;
            background: transparent; color: #e9edef;
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem; line-height: 1.35;
            max-height: 120px; padding: 10px 8px 10px 4px;
            overflow-y: auto;
        }
        .pill textarea::placeholder { color: #8696a0; }
        .send-btn {
            background: #00a884; color: #fff; font-size: 1.15rem;
        }
        .send-btn:disabled { opacity: 0.5; }
        .mic-btn { background: #00a884; color: #fff; display: none; }

        .hidden { display: none !important; }

        .context-menu {
            position: fixed; background: #233138; border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.45); z-index: 200;
            padding: 6px; min-width: 170px;
        }
        .context-menu button {
            display: flex; align-items: center; gap: 10px; width: 100%;
            padding: 11px 14px; border: none; background: none; cursor: pointer;
            border-radius: 8px; font-family: 'Tajawal', sans-serif; font-size: 0.95rem;
            text-align: right; color: #e9edef;
        }
        .context-menu button:active { background: #182229; }
        .context-menu button.danger { color: #f87171; }

        .reaction-picker {
            position: fixed; background: #233138; border-radius: 28px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.45); z-index: 210;
            padding: 8px 12px; display: flex; gap: 8px; font-size: 1.55rem;
        }
        .reaction-picker span { cursor: pointer; transform: scale(1); transition: transform 0.12s; }
        .reaction-picker span:active { transform: scale(1.25); }

        .image-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92);
            z-index: 300; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .image-overlay img { max-width: 95vw; max-height: 90vh; border-radius: 8px; }

        .message-row.swiping {
            transition: none;
        }
        .swipe-hint {
            position: absolute;
            top: 50%;
            width: 32px; height: 32px;
            margin-top: -16px;
            border-radius: 50%;
            background: #00a884;
            color: #fff;
            font-size: 1rem;
            display: flex; align-items: center; justify-content: center;
            opacity: 0;
            transform: scale(0.4);
            pointer-events: none;
            z-index: 2;
        }
        .received .swipe-hint { left: -6px; }
        .sent .swipe-hint { right: -6px; }
        .swipe-hint.show {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>
<div class="chat-wrapper">
    <header class="chat-header">
        <button class="back-arrow" onclick="goBack()" aria-label="رجوع">➜</button>
        <span id="connectionIndicator" class="connection-dot offline" title="حالة الاتصال"></span>
        <div id="myAvatarContainer" class="header-avatar" style="background:#00a884;">ي</div>
        <div class="header-meta">
            <div class="header-title" id="headerTitle">مجموعة الورديات</div>
            <div class="header-sub" id="headerSubtitle">قناة اليمن اليوم</div>
        </div>
    </header>

    <div id="messagesArea" class="messages-area">
        <div style="text-align:center;color:#8696a0;padding:24px;font-size:0.9rem;">لا توجد رسائل بعد</div>
    </div>

    <div class="composer">
        <div id="replyBar" class="reply-preview">
            <div class="quote-bar"></div>
            <div class="reply-preview-body">
                <div class="reply-preview-name" id="replyTargetName"></div>
                <div class="reply-preview-text" id="replyTargetPreview"></div>
            </div>
            <button class="reply-close" onclick="cancelReply()" aria-label="إلغاء الرد">✕</button>
        </div>
        <div class="input-row">
            <button class="attach-btn" onclick="document.getElementById('imageInput').click()" title="إرفاق">📎</button>
            <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
            <div class="pill">
                <button type="button" class="emoji-btn" id="emojiToggle" title="رمز">😊</button>
                <textarea id="messageInput" rows="1" placeholder="رسالة" autocomplete="off"></textarea>
            </div>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="إرسال">➤</button>
        </div>
    </div>
</div>

<div id="contextMenu" class="context-menu hidden">
    <button onclick="contextAction('reply')">↩️ رد</button>
    <button onclick="contextAction('react')">😀 تفاعل</button>
    <button onclick="contextAction('edit')" id="ctxEditBtn">✏️ تعديل</button>
    <button onclick="contextAction('delete')" id="ctxDeleteBtn" class="danger">🗑️ حذف</button>
</div>
<div id="reactionPicker" class="reaction-picker hidden">
    <span data-emoji="👍">👍</span>
    <span data-emoji="❤️">❤️</span>
    <span data-emoji="😂">😂</span>
    <span data-emoji="😮">😮</span>
    <span data-emoji="😢">😢</span>
    <span data-emoji="🙏">🙏</span>
</div>
<div id="imageOverlay" class="image-overlay hidden" onclick="this.classList.add('hidden')">
    <img id="overlayImage" src="" alt="">
</div>

<script>
firebase.initializeApp(APP_CONFIG.firebaseConfig);
const db = firebase.database();
try { db.setPersistenceEnabled(true); } catch (e) {}

let USERS = Object.assign({}, APP_CONFIG.users);
(async function loadFirebaseUsers() {
    try {
        const snap = await db.ref('users').once('value');
        const fb = snap.val() || {};
        Object.keys(fb).forEach(function(u) {
            if (fb[u] && fb[u].passwordHash) {
                USERS[u] = Object.assign({}, APP_CONFIG.users[u] || fb[u], fb[u]);
            }
        });
    } catch (e) {}
})();

function getDeviceId() {
    let id = localStorage.getItem('deviceId');
    if (!id) {
        const arr = new Uint8Array(16);
        crypto.getRandomValues(arr);
        id = Array.from(arr).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
        localStorage.setItem('deviceId', id);
    }
    return id;
}

let currentUser = null;
(async function verifySession() {
    const saved = localStorage.getItem('currentUser');
    if (saved) {
        try {
            const parsed = JSON.parse(saved);
            if (!parsed.username) throw new Error('no username');
            const configUser = APP_CONFIG.users[parsed.username] || null;
            if (configUser && parsed.passwordHash === configUser.passwordHash) {
                currentUser = { username: parsed.username, ...configUser };
            }
            let fbUser = null;
            try {
                const snap = await db.ref('users/' + parsed.username).once('value');
                fbUser = snap.val();
            } catch(e) {}
            const preferredHash = (fbUser && fbUser.passwordHash) || (configUser && configUser.passwordHash) || null;
            const u = USERS[parsed.username] || configUser || fbUser;
            if (u) {
                const hashOk = preferredHash && parsed.passwordHash === preferredHash;
                if (hashOk) {
                    currentUser = { username: parsed.username, ...(configUser || {}), ...(fbUser || {}) };
                } else if (parsed.sessionToken) {
                    try {
                        const sess = await db.ref('sessions/' + parsed.username).once('value');
                        if (sess.val() && sess.val().sessionToken === parsed.sessionToken) {
                            currentUser = { username: parsed.username, ...(configUser || {}), ...(fbUser || {}) };
                        }
                    } catch(e) {}
                }
            }
        } catch(e) {}
    }
    if (!currentUser) {
        await new Promise(function(r) { setTimeout(r, 1500); });
        if (!currentUser) {
            alert('انتهت الجلسة. الرجاء تسجيل الدخول من الصفحة الرئيسية.');
            window.location.href = 'index.html';
        }
    }
    if (currentUser && window.YTPush) {
        YTPush.subscribeAndSave(db, currentUser.username).catch(function() {});
    }
    if (currentUser) {
        document.getElementById('headerSubtitle').textContent = currentUser.username + (currentUser.role === 'admin' ? ' · مشرف' : '');
        setAvatarEl(document.getElementById('myAvatarContainer'), currentUser.username);
    }
})();

const userColors = {
    'زكريا': '#02a698', 'منصور': '#f59e0b', 'محمد': '#53bdeb',
    'نورا': '#ef4444', 'اشرف': '#00a884', 'شرف': '#a855f7'
};
const defaultPhotos = {
    'زكريا': 'image/1.jpg',
    'منصور': 'image/2.jpg',
    'محمد': 'image/3.jpg',
    'نورا': 'image/4.jpg'
};
let employeePhotos = Object.assign({}, defaultPhotos);

function loadEmployeePhotos() {
    try {
        const cached = JSON.parse(localStorage.getItem('yt_offline_employees_v1') || 'null');
        if (Array.isArray(cached)) {
            cached.forEach(function(e) {
                if (e && e.name && e.image) employeePhotos[e.name] = e.image;
            });
        }
    } catch (e) {}
    db.ref('employees').on('value', function(snap) {
        const data = snap.val();
        const list = Array.isArray(data) ? data : (data ? Object.values(data) : []);
        list.forEach(function(e) {
            if (e && e.name && e.image) employeePhotos[e.name] = e.image;
        });
        document.querySelectorAll('.msg-avatar[data-user], .header-avatar[data-user]').forEach(function(el) {
            setAvatarEl(el, el.getAttribute('data-user'));
        });
    });
}
loadEmployeePhotos();

function getUserColor(u) { return userColors[u] || '#00a884'; }
function getUserInitial(u) { return u ? u.charAt(0) : '?'; }
function getUserPhoto(u) { return employeePhotos[u] || defaultPhotos[u] || ''; }

function setAvatarEl(el, username) {
    if (!el) return;
    el.setAttribute('data-user', username || '');
    el.title = username || '';
    el.style.background = getUserColor(username);
    const src = getUserPhoto(username);
    el.innerHTML = '';
    if (src) {
        const img = document.createElement('img');
        img.src = src;
        img.alt = username || '';
        img.onerror = function() {
            el.innerHTML = '';
            el.textContent = getUserInitial(username);
        };
        el.appendChild(img);
    } else {
        el.textContent = getUserInitial(username);
    }
}
function createAvatarElement(username) {
    const div = document.createElement('div');
    div.className = 'msg-avatar';
    setAvatarEl(div, username);
    return div;
}

const CACHE_VERSION = 3;
localStorage.setItem('chatCacheVersion', String(CACHE_VERSION));

const messagesArea = document.getElementById('messagesArea');
const messageInput = document.getElementById('messageInput');
const loadedMessages = new Set();
let replyTo = null, contextMessageKey = null, reactionTargetKey = null;

function autosizeInput() {
    messageInput.style.height = 'auto';
    messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
}
messageInput.addEventListener('input', autosizeInput);

function renderMessages() {
    try {
        const cached = JSON.parse(localStorage.getItem('chatCache') || '[]');
        cached.sort(function(a, b) { return (a.timestamp || 0) - (b.timestamp || 0); });
        messagesArea.innerHTML = '';
        loadedMessages.clear();
        cached.forEach(function(m) {
            loadedMessages.add(m.key);
            appendMessage(m.key, m);
        });
        if (!cached.length) {
            messagesArea.innerHTML = '<div style="text-align:center;color:#8696a0;padding:24px;font-size:0.9rem;">لا توجد رسائل بعد</div>';
        }
        messagesArea.scrollTop = messagesArea.scrollHeight;
    } catch(e) {}
}

function loadNetworkMessages() {
    db.ref('chat/general').orderByChild('timestamp').limitToLast(300).once('value', function(snap) {
        try {
            const val = snap.val() || {};
            const msgs = Object.entries(val).map(function(entry) { return Object.assign({ key: entry[0] }, entry[1]); });
            if (msgs.length) {
                msgs.sort(function(a, b) { return (a.timestamp || 0) - (b.timestamp || 0); });
                const toSave = msgs.filter(function(m) { return !m.image; }).map(function(m) {
                    return { key: m.key, sender: m.sender, senderId: m.senderId, deviceId: m.deviceId, time: m.time, timestamp: m.timestamp, text: m.text, edited: m.edited, reactions: m.reactions, replyTo: m.replyTo, imageUrl: m.imageUrl };
                });
                localStorage.setItem('chatCache', JSON.stringify(toSave.slice(-300)));
                renderMessages();
            }
        } catch(e) {}
    });
}

renderMessages();
loadNetworkMessages();

firebase.database().ref('.info/connected').on('value', function(snap) {
    document.getElementById('connectionIndicator').className = 'connection-dot ' + (snap.val() ? 'online' : 'offline');
});

function goBack() {
    try {
        const session = JSON.parse(localStorage.getItem('currentUser') || '{}');
        if (session.username) {
            localStorage.setItem('lastChatTimestamp_' + session.username, String(Date.now()));
        }
    } catch(e) {}
    localStorage.removeItem('chatWindowOpen');
    window.location.href = 'index.html';
}

messageInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

db.ref('chat/general').on('child_added', function(snap) {
    if (loadedMessages.has(snap.key)) return;
    loadedMessages.add(snap.key);
    const msg = snap.val();
    appendMessage(snap.key, msg);
    try {
        const cached = JSON.parse(localStorage.getItem('chatCache') || '[]');
        cached.push({
            key: snap.key, sender: msg.sender, senderId: msg.senderId, deviceId: msg.deviceId,
            time: msg.time, timestamp: msg.timestamp, text: msg.text, edited: msg.edited,
            reactions: msg.reactions, replyTo: msg.replyTo, imageUrl: msg.imageUrl
        });
        localStorage.setItem('chatCache', JSON.stringify(cached.slice(-300)));
    } catch(e) {}
    scrollToBottom();
});
db.ref('chat/general').on('child_changed', function(snap) {
    const el = document.getElementById('msg-' + snap.key);
    if (el) { el.remove(); loadedMessages.delete(snap.key); }
    loadedMessages.add(snap.key);
    appendMessage(snap.key, snap.val());
    try {
        const cached = JSON.parse(localStorage.getItem('chatCache') || '[]');
        const i = cached.findIndex(function(m) { return m.key === snap.key; });
        if (i >= 0) {
            cached[i] = Object.assign({}, cached[i], {
                text: snap.val().text, edited: snap.val().edited,
                reactions: snap.val().reactions, replyTo: snap.val().replyTo
            });
            localStorage.setItem('chatCache', JSON.stringify(cached));
        }
    } catch(e) {}
});
db.ref('chat/general').on('child_removed', function(snap) {
    const el = document.getElementById('msg-' + snap.key);
    if (el) el.remove();
    loadedMessages.delete(snap.key);
    try {
        const cached = JSON.parse(localStorage.getItem('chatCache') || '[]');
        const i = cached.findIndex(function(m) { return m.key === snap.key; });
        if (i >= 0) { cached.splice(i, 1); localStorage.setItem('chatCache', JSON.stringify(cached)); }
    } catch(e) {}
});

const storage = firebase.storage();
let pendingImageData = null, pendingImageName = null;

async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text && !pendingImageData) return;
    if (!currentUser) return;

    let imageUrl = null;
    if (pendingImageData) {
        try {
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            const ref = storage.ref('chat/' + currentUser.username + '/' + pendingImageName);
            const snapshot = await ref.putString(pendingImageData, 'data_url');
            imageUrl = await snapshot.ref.getDownloadURL();
            sendBtn.disabled = false;
        } catch(e) {
            alert('فشل رفع الصورة');
            document.getElementById('sendBtn').disabled = false;
            return;
        }
    }
    pendingImageData = null; pendingImageName = null;

    const msg = {
        sender: currentUser.username, senderId: currentUser.id,
        deviceId: getDeviceId(),
        time: new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' }),
        timestamp: firebase.database.ServerValue.TIMESTAMP,
        isAdmin: currentUser.role === 'admin', edited: false, reactions: {}
    };
    if (text) msg.text = text;
    if (imageUrl) msg.imageUrl = imageUrl;
    if (replyTo) {
        msg.replyTo = { key: replyTo.key, sender: replyTo.sender, text: replyTo.text };
        cancelReply();
    }
    db.ref('chat/general').push(msg);
    messageInput.value = '';
    autosizeInput();
    try {
        if (window.YTPush) {
            const preview = text ? (text.length > 60 ? text.substring(0, 60) + '...' : text) : '📷 صورة';
            YTPush.notifyAllDevices(db, {
                title: '💬 رسالة جديدة في الدردشة',
                body: (currentUser.username || '') + ': ' + preview,
                tag: 'chat-notification-' + Date.now(),
                url: './chat.html'
            }, YTPush.getDeviceId()).catch(function() {});
        }
    } catch (e) {}
}

function handleImageUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) { alert('حجم الصورة كبير جداً'); return; }
    const reader = new FileReader();
    reader.onload = function(e) {
        pendingImageData = e.target.result;
        pendingImageName = Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.' + (file.type.split('/')[1] || 'jpg');
        sendMessage();
    };
    reader.readAsDataURL(file);
    event.target.value = '';
}

function startReply(key, msg) {
    replyTo = { key: key, sender: msg.sender, text: msg.text || '📷 صورة' };
    document.getElementById('replyBar').classList.add('show');
    document.getElementById('replyTargetName').textContent = msg.sender;
    document.getElementById('replyTargetPreview').textContent = (msg.text || '📷 صورة').substring(0, 80);
    messageInput.focus();
}

function appendMessage(key, msg) {
    if (!msg) return;
    const empty = messagesArea.querySelector('div[style*="text-align"]');
    if (empty && !empty.id) empty.remove();
    if (document.getElementById('msg-' + key)) return;
    const isSent = currentUser && msg.sender === currentUser.username;
    const row = document.createElement('div');
    row.className = 'message-row ' + (isSent ? 'sent' : 'received');
    row.id = 'msg-' + key;

    const hint = document.createElement('span');
    hint.className = 'swipe-hint';
    hint.textContent = '↩';
    row.appendChild(hint);

    const avatar = createAvatarElement(msg.sender);
    const content = document.createElement('div');
    content.className = 'msg-content';
    if (!isSent) {
        const nameDiv = document.createElement('div');
        nameDiv.className = 'msg-sender-name';
        nameDiv.style.color = getUserColor(msg.sender);
        nameDiv.textContent = msg.sender + (msg.isAdmin ? ' 👑' : '');
        content.appendChild(nameDiv);
    }
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    if (msg.replyTo) {
        const quote = document.createElement('div');
        quote.className = 'quote';
        quote.innerHTML = '<div class="quote-bar"></div><div class="quote-body"><div class="quote-name"></div><div class="quote-text"></div></div>';
        quote.querySelector('.quote-name').textContent = msg.replyTo.sender || '';
        quote.querySelector('.quote-text').textContent = msg.replyTo.text || '📷 صورة';
        quote.onclick = function(ev) {
            ev.stopPropagation();
            const target = document.getElementById('msg-' + msg.replyTo.key);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                target.classList.add('highlight');
                setTimeout(function() { target.classList.remove('highlight'); }, 1600);
            }
        };
        bubble.appendChild(quote);
    }
    if (msg.text) {
        const textDiv = document.createElement('div');
        textDiv.className = 'msg-text' + (msg.edited ? ' edited-mark' : '');
        textDiv.textContent = msg.text;
        bubble.appendChild(textDiv);
    }
    if (msg.image || msg.imageUrl) {
        const src = msg.imageUrl || msg.image;
        const img = document.createElement('img');
        img.className = 'msg-image';
        img.src = src;
        img.loading = 'lazy';
        img.onclick = function() {
            document.getElementById('overlayImage').src = src;
            document.getElementById('imageOverlay').classList.remove('hidden');
        };
        bubble.appendChild(img);
    }
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    const timeDiv = document.createElement('span');
    timeDiv.className = 'msg-time';
    timeDiv.textContent = msg.time || '';
    const ticks = document.createElement('span');
    ticks.className = 'msg-ticks';
    ticks.textContent = '✓✓';
    meta.appendChild(timeDiv);
    meta.appendChild(ticks);
    bubble.appendChild(meta);
    content.appendChild(bubble);

    const reactionsRow = document.createElement('div');
    reactionsRow.className = 'reactions-row';
    if (msg.reactions) {
        Object.entries(msg.reactions).forEach(function(entry) {
            const emoji = entry[0], users = entry[1];
            if (users && users.length) {
                const chip = document.createElement('span');
                chip.className = 'reaction-chip';
                if (currentUser && users.indexOf(currentUser.username) >= 0) chip.classList.add('active');
                chip.textContent = emoji + ' ' + users.length;
                chip.title = users.join('، ');
                chip.onclick = function() { toggleReaction(key, emoji); };
                reactionsRow.appendChild(chip);
            }
        });
    }
    if (reactionsRow.childNodes.length) content.appendChild(reactionsRow);

    bubble.addEventListener('contextmenu', function(e) { e.preventDefault(); showContextMenu(e, key, msg); });
    bubble.addEventListener('dblclick', function() { startReply(key, msg); });

    let holdTimer = null;
    let startX = 0, dragging = false, lastDx = 0;
    const MAX_SWIPE = 72;
    function swipeOffset(dx) {
        if (isSent) return Math.max(-MAX_SWIPE, Math.min(0, dx));
        return Math.max(0, Math.min(MAX_SWIPE, dx));
    }
    row.addEventListener('touchstart', function(e) {
        startX = e.changedTouches[0].screenX;
        dragging = false;
        lastDx = 0;
        row.classList.add('swiping');
        holdTimer = setTimeout(function() {
            if (!dragging) {
                const rect = bubble.getBoundingClientRect();
                showReactionPicker({ pageX: rect.left + rect.width / 2, pageY: rect.top }, key);
            }
        }, 450);
    }, { passive: true });
    row.addEventListener('touchmove', function(e) {
        const dx = e.changedTouches[0].screenX - startX;
        if (Math.abs(dx) > 8) {
            dragging = true;
            clearTimeout(holdTimer);
        }
        if (!dragging) return;
        lastDx = swipeOffset(dx);
        row.style.transform = 'translateX(' + lastDx + 'px)';
        const progress = Math.min(1, Math.abs(lastDx) / 48);
        hint.style.opacity = String(progress);
        hint.style.transform = 'scale(' + (0.4 + 0.6 * progress) + ')';
        if (progress > 0.85) hint.classList.add('show');
        else hint.classList.remove('show');
    }, { passive: true });
    function endSwipe() {
        clearTimeout(holdTimer);
        row.classList.remove('swiping');
        row.style.transition = 'transform 0.2s ease';
        const shouldReply = Math.abs(lastDx) > 48;
        row.style.transform = 'translateX(0)';
        hint.style.opacity = '0';
        hint.style.transform = 'scale(0.4)';
        hint.classList.remove('show');
        setTimeout(function() { row.style.transition = ''; }, 220);
        if (shouldReply) startReply(key, msg);
        dragging = false;
        lastDx = 0;
    }
    row.addEventListener('touchend', endSwipe);
    row.addEventListener('touchcancel', endSwipe);

    row.appendChild(avatar);
    row.appendChild(content);
    messagesArea.appendChild(row);
}

function showContextMenu(e, key, msg) {
    contextMessageKey = key;
    const menu = document.getElementById('contextMenu');
    const canOwn = currentUser && (msg.sender === currentUser.username || currentUser.role === 'admin');
    document.getElementById('ctxEditBtn').style.display = (canOwn && msg.text) ? 'flex' : 'none';
    document.getElementById('ctxDeleteBtn').style.display = canOwn ? 'flex' : 'none';
    menu.classList.remove('hidden');
    let left = e.pageX || 80, top = e.pageY || 180;
    if (left + 180 > window.innerWidth) left = window.innerWidth - 190;
    if (top + 220 > window.innerHeight) top = window.innerHeight - 230;
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
}
function contextAction(action) {
    const key = contextMessageKey;
    document.getElementById('contextMenu').classList.add('hidden');
    if (!key) return;
    db.ref('chat/general/' + key).once('value', function(snap) {
        const msg = snap.val();
        if (!msg && action !== 'delete') return;
        if (action === 'reply') startReply(key, msg);
        if (action === 'react') {
            const el = document.getElementById('msg-' + key);
            if (el) {
                const rect = el.getBoundingClientRect();
                showReactionPicker({ pageX: rect.left + rect.width / 2, pageY: rect.top }, key);
            }
        }
        if (action === 'edit' && msg.text) {
            const t = prompt('تعديل الرسالة:', msg.text);
            if (t && t.trim() && t.trim() !== msg.text) db.ref('chat/general/' + key).update({ text: t.trim(), edited: true });
        }
        if (action === 'delete' && confirm('حذف هذه الرسالة؟')) db.ref('chat/general/' + key).remove();
    });
}
function showReactionPicker(e, key) {
    reactionTargetKey = key;
    const picker = document.getElementById('reactionPicker');
    picker.classList.remove('hidden');
    let left = e.pageX || 80, top = (e.pageY || 180) - 64;
    if (left + 240 > window.innerWidth) left = window.innerWidth - 250;
    if (top < 50) top = 50;
    picker.style.left = left + 'px';
    picker.style.top = top + 'px';
}
function toggleReaction(key, emoji) {
    if (!currentUser) return;
    db.ref('chat/general/' + key + '/reactions/' + emoji).transaction(function(users) {
        if (!users) return [currentUser.username];
        if (Array.isArray(users)) {
            if (users.indexOf(currentUser.username) >= 0) {
                const f = users.filter(function(u) { return u !== currentUser.username; });
                return f.length ? f : null;
            }
            return users.concat([currentUser.username]);
        }
        return [currentUser.username];
    });
    document.getElementById('reactionPicker').classList.add('hidden');
}
document.querySelectorAll('#reactionPicker span').forEach(function(s) {
    s.addEventListener('click', function() { toggleReaction(reactionTargetKey, s.dataset.emoji); });
});
function cancelReply() {
    replyTo = null;
    document.getElementById('replyBar').classList.remove('show');
}
document.addEventListener('click', function(e) {
    if (!e.target.closest('.context-menu') && !e.target.closest('.msg-bubble')) {
        document.getElementById('contextMenu').classList.add('hidden');
    }
    if (!e.target.closest('.reaction-picker') && !e.target.closest('.msg-bubble')) {
        document.getElementById('reactionPicker').classList.add('hidden');
    }
});
function scrollToBottom() { messagesArea.scrollTop = messagesArea.scrollHeight; }

document.getElementById('emojiToggle').addEventListener('click', function() {
    let bar = document.getElementById('emojiBar');
    if (!bar) {
        bar = document.createElement('div');
        bar.id = 'emojiBar';
        bar.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;background:#111b21;border-radius:10px;margin-bottom:6px;font-size:1.35rem;';
        '😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 😉 😍 🥰 😘 😋 😜 🤗 🤔 😐 😴 😭 😡 👍 👎 ❤️ 🔥 🙏 👏 🎉 📷'.split(' ').forEach(function(em) {
            const b = document.createElement('span');
            b.textContent = em;
            b.style.cursor = 'pointer';
            b.onclick = function() {
                messageInput.value += em;
                autosizeInput();
                messageInput.focus();
            };
            bar.appendChild(b);
        });
        document.querySelector('.composer').insertBefore(bar, document.querySelector('.input-row'));
    } else {
        bar.style.display = bar.style.display === 'none' ? 'flex' : 'none';
    }
});
</script>
