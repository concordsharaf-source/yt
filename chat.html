<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الدردشة - قناة اليمن اليوم</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #e8e8e8;
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .chat-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            box-shadow: 0 0 40px rgba(0,0,0,0.08);
        }

        /* الهيدر */
        .chat-header {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .connection-dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 8px; }
        .connection-dot.online { background: #22c55e; color: #22c55e; }
        .connection-dot.offline { background: #ef4444; color: #ef4444; }
        .avatar-circle {
            width: 38px; height: 38px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-weight: 700;
            color: white; flex-shrink: 0;
        }
        .back-btn {
            background: rgba(255,255,255,0.15); border: none; color: white;
            padding: 8px 14px; border-radius: 20px; cursor: pointer;
            font-family: 'Tajawal', sans-serif; font-size: 0.85rem;
        }

        /* منطقة الرسائل */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            background: #e8e8e8;
        }

        /* رسالة */
        .message-row { display: flex; gap: 8px; max-width: 85%; margin-bottom: 8px; }
        .message-row.sent { align-self: flex-end; flex-direction: row-reverse; }
        .message-row.received { align-self: flex-start; }
        .msg-avatar {
            width: 34px; height: 34px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-weight: 700;
            color: white; flex-shrink: 0; margin-top: 4px;
        }
        .msg-sender-name { font-size: 0.7rem; font-weight: 700; color: #3b82f6; margin-bottom: 2px; }
        .msg-bubble {
            padding: 8px 14px; border-radius: 18px; word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }
        .sent .msg-bubble { background: #dcf8c6; border-bottom-right-radius: 4px; }
        .received .msg-bubble { background: white; border-bottom-left-radius: 4px; }
        .msg-text { font-size: 0.95rem; white-space: pre-wrap; }
        .msg-image { max-width: 200px; border-radius: 12px; cursor: pointer; margin: 4px 0; }
        .msg-time { font-size: 0.65rem; color: #8b8b8b; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
        .msg-actions-btn { opacity: 0; background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 2px 6px; }
        .msg-bubble:hover .msg-actions-btn { opacity: 1; }

        /* الريأكشن */
        .reactions-row { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
        .reaction-chip {
            background: white; border: 1px solid #e5e7eb; border-radius: 14px;
            padding: 1px 8px; font-size: 0.75rem; cursor: pointer;
        }
        .reaction-chip.active { background: #dbeafe; border-color: #3b82f6; }
        .add-reaction-btn {
            background: none; border: none; font-size: 0.9rem; cursor: pointer;
            color: rgba(156,163,175,0.6); padding: 1px 4px;
        }
        .add-reaction-btn:hover { color: #ef4444; }

        .context-menu, .reaction-picker { /* كما السابق */ }

        /* شريط الإدخال (ثابت أسفل) */
        .input-bar {
            background: white;
            border-top: 2px solid #e5e7eb;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            z-index: 20;
        }
        .input-bar input[type="text"] {
            flex: 1;
            border: 2px solid #d1d5db;
            border-radius: 22px;
            padding: 10px 16px;
            outline: none;
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            background: white;
            transition: border-color 0.2s;
        }
        .input-bar input[type="text"]:focus { border-color: #3b82f6; }
        .input-bar .send-btn {
            background: #2563eb; color: white; border: none;
            width: 42px; height: 42px; border-radius: 50%; font-size: 1.3rem;
            cursor: pointer; flex-shrink: 0;
        }

        .reply-bar {
            background: #f0f7ff; border-top: 1px solid #bfdbfe;
            padding: 8px 14px; flex-shrink: 0; font-size: 0.85rem;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="chat-wrapper">
    <!-- الهيدر -->
    <header class="chat-header">
        <div class="header-left">
            <span id="connectionIndicator" class="connection-dot offline"></span>
            <div id="myAvatarContainer" class="avatar-circle" style="background:#4f46e5;">؟</div>
            <div>
                <div class="font-bold text-sm" id="headerTitle">💬 الدردشة</div>
                <div class="text-xs text-white/70" id="headerSubtitle">قناة اليمن اليوم</div>
            </div>
        </div>
        <button onclick="goBack()" class="back-btn">🗓️ التقويم</button>
    </header>

    <!-- منطقة الرسائل -->
    <div id="messagesArea" class="messages-area"></div>

    <!-- شريط الرد -->
    <div id="replyBar" class="reply-bar hidden">
        <span>↩️ رد على: <strong id="replyTargetName"></strong></span>
        <span id="replyTargetPreview" class="text-gray-500 text-xs"></span>
        <button onclick="cancelReply()" style="margin-right:auto; background:none; border:none; font-size:1.2rem; cursor:pointer;">✕</button>
    </div>

    <!-- شريط الإدخال (خانة الكتابة) -->
    <div class="input-bar">
        <button onclick="document.getElementById('imageInput').click()" style="font-size:1.5rem; background:none; border:none; cursor:pointer;">🖼️</button>
        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
        <!-- هذا هو حقل الكتابة المطلوب -->
        <input type="text" id="messageInput" placeholder="اكتب رسالة..." autocomplete="off" autocorrect="off" spellcheck="false" dir="auto">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
</div>

<!-- بقية العناصر (قائمة السياق، الريأكشن، معاينة الصورة) كما في النسخة السابقة، سأختصرها هنا -->
<div id="contextMenu" class="context-menu hidden">...</div>
<div id="reactionPicker" class="reaction-picker hidden">...</div>
<div id="imageOverlay" class="image-overlay hidden" onclick="this.classList.add('hidden')"><img id="overlayImage" src=""></div>

<script>
// (نفس كود الجافاسكريبت الموجود في الإصدار السابق، بدون تغيير)
// للتأكد من ظهور الخانة، تم تبسيط CSS وعدم وجود أي تعارضات.
</script>
</body>
</html>
