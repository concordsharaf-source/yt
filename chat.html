<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الدردشة - قناة اليمن اليوم</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body {
            font-family: 'Tajawal', sans-serif;
            background: #f0f2f5;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 800px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .message-wrapper { max-width: 80%; position: relative; }
        .message-wrapper.sent { align-self: flex-end; }
        .message-wrapper.received { align-self: flex-start; }
        .message-bubble {
            padding: 0.75rem 1rem;
            border-radius: 1.25rem;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .sent .message-bubble { background: #d1f7c4; border-bottom-right-radius: 0.25rem; }
        .received .message-bubble { background: white; border-bottom-left-radius: 0.25rem; }
        .sender-name { font-size: 0.7rem; font-weight: bold; color: #3b82f6; margin-bottom: 0.25rem; }
        .message-time { font-size: 0.65rem; color: #6b7280; margin-top: 0.25rem; text-align: left; }
        .connection-dot {
            width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-left: 4px;
        }
        .connection-dot.online { background-color: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .connection-dot.offline { background-color: #ef4444; box-shadow: 0 0 10px #ef4444; }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- هيدر مطابق للرئيسية -->
        <nav class="bg-gradient-to-r from-blue-600 to-blue-800 text-white shadow-lg p-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span id="connectionIndicator" class="connection-dot offline"></span>
                <h1 class="text-lg font-bold" id="chatHeaderTitle">💬 الدردشة</h1>
            </div>
            <div class="flex items-center gap-3">
                <span id="welcomeUser" class="text-sm"></span>
                <button onclick="goBackToCalendar()" class="bg-white/20 hover:bg-white/30 px-3 py-1 rounded-lg text-sm">🗓️ التقويم</button>
            </div>
        </nav>

        <div id="messagesContainer" class="chat-messages">
            <div class="text-center text-gray-400 py-8">جارٍ تحميل المحادثة...</div>
        </div>

        <div class="bg-white border-t p-3 flex items-end gap-2">
            <input type="text" id="messageInput" placeholder="اكتب رسالة..." class="flex-1 border rounded-xl px-4 py-2 outline-none">
            <button id="sendBtn" class="bg-blue-500 text-white px-4 py-2 rounded-full">➤</button>
        </div>
    </div>

    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCHd1yY27vSskKuvvNZ_XmtwgoHc3lPe5k",
            authDomain: "ytcalender-bae88.firebaseapp.com",
            databaseURL: "https://ytcalender-bae88-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ytcalender-bae88",
            storageBucket: "ytcalender-bae88.firebasestorage.app",
            messagingSenderId: "625139846676",
            appId: "1:625139846676:web:691be456f3f31e6572e101"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = JSON.parse(localStorage.getItem('currentUserForChat'));
        if (!currentUser) {
            alert('الرجاء تسجيل الدخول من الصفحة الرئيسية أولاً');
            window.location.href = 'index.html';
        }

        document.getElementById('welcomeUser').textContent = '👋 ' + currentUser.username;
        document.getElementById('chatHeaderTitle').textContent = '💬 الدردشة - ' + currentUser.username;

        const connectedRef = firebase.database().ref(".info/connected");
        connectedRef.on("value", (snap) => {
            document.getElementById('connectionIndicator').className = 
                'connection-dot ' + (snap.val() === true ? 'online' : 'offline');
        });

        function goBackToCalendar() {
            if (window.opener && !window.opener.closed) {
                window.opener.focus();
                window.close();
            } else {
                window.location.href = 'index.html';
            }
        }

        // تحميل الرسائل
        const messagesContainer = document.getElementById('messagesContainer');
        db.ref('chat/general').on('child_added', (snap) => {
            appendMessage(snap.key, snap.val());
        });

        function appendMessage(key, msg) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${msg.sender === currentUser.username ? 'sent' : 'received'}`;
            wrapper.innerHTML = `
                <div class="message-bubble">
                    ${msg.sender !== currentUser.username ? `<div class="sender-name">${msg.sender}</div>` : ''}
                    <div>${msg.text || ''}</div>
                    <div class="message-time">${msg.time || ''}</div>
                </div>
            `;
            messagesContainer.appendChild(wrapper);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        document.getElementById('sendBtn').addEventListener('click', () => {
            const text = document.getElementById('messageInput').value.trim();
            if (!text) return;
            db.ref('chat/general').push({
                text,
                sender: currentUser.username,
                time: new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' }),
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
            document.getElementById('messageInput').value = '';
        });
    </script>
</body>
</html>
