<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الدردشة - قناة اليمن اليوم</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #e8e8e8;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        .chat-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            box-shadow: 0 0 40px rgba(0,0,0,0.08);
        }

        /* ----- الهيدر ----- */
        .chat-header {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 30;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .connection-dot {
            width: 10px; height: 10px; border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
        }
        .connection-dot.online { background: #22c55e; color: #22c55e; }
        .connection-dot.offline { background: #ef4444; color: #ef4444; }
        .avatar-circle {
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 1.1rem; color: white;
            border: 2px solid rgba(255,255,255,0.6);
            flex-shrink: 0;
        }
        .back-btn {
            background: rgba(255,255,255,0.15); border: none; color: white;
            padding: 8px 14px; border-radius: 20px; cursor: pointer;
            font-family: 'Tajawal', sans-serif; font-size: 0.85rem;
        }

        /* ----- منطقة الرسائل ----- */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            background: #e8e8e8;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* ----- رسالة ----- */
        .message-row {
            display: flex;
            gap: 8px;
            max-width: 85%;
            animation: msgIn 0.3s ease;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-row.sent { align-self: flex-end; flex-direction: row-reverse; }
        .message-row.received { align-self: flex-start; }

        .msg-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.9rem; color: white;
            flex-shrink: 0; margin-top: 4px;
        }
        .msg-content { display: flex; flex-direction: column; min-width: 60px; }
        .msg-sender-name {
            font-size: 0.7rem; font-weight: 700; color: #3b82f6;
            margin-bottom: 2px; padding: 0 4px;
        }

        .msg-bubble {
            padding: 8px 14px; border-radius: 18px;
            position: relative; word-wrap: break-word; line-height: 1.5;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }
        .sent .msg-bubble { background: #dcf8c6; border-bottom-right-radius: 4px; }
        .received .msg-bubble { background: white; border-bottom-left-radius: 4px; }

        .reply-preview {
            background: rgba(0,0,0,0.06); border-radius: 10px; padding: 6px 10px;
            margin-bottom: 6px; border-right: 3px solid #3b82f6; font-size: 0.8rem;
            cursor: pointer; max-width: 100%;
        }
        .reply-preview .reply-sender { font-weight: 700; color: #3b82f6; font-size: 0.7rem; }
        .reply-preview .reply-text {
            color: #4b5563; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .msg-image {
            max-width: 240px; max-height: 300px; border-radius: 12px;
            cursor: pointer; margin: 4px 0; display: block;
        }
        .msg-text { font-size: 0.95rem; color: #1f2937; white-space: pre-wrap; }
        .msg-text.edited-mark::after {
            content: ' (مُعدّلة)'; font-size: 0.65rem; color: #9ca3af;
        }
        .msg-time {
            font-size: 0.65rem; color: #8b8b8b; margin-top: 2px;
            text-align: left; padding: 0 4px; display: flex; align-items: center; gap: 4px;
        }
        .msg-actions-btn {
            opacity: 0; background: none; border: none; cursor: pointer;
            font-size: 1.1rem; padding: 2px 6px; border-radius: 50%; color: #6b7280;
        }
        .msg-bubble:hover .msg-actions-btn { opacity: 1; }

        /* ----- الريأكشن ----- */
        .reactions-row {
            display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; padding: 0 4px;
        }
        .reaction-chip {
            background: white; border: 1px solid #e5e7eb; border-radius: 14px;
            padding: 1px 8px; font-size: 0.75rem; cursor: pointer;
            display: flex; align-items: center; gap: 3px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .reaction-chip.active { background: #dbeafe; border-color: #3b82f6; font-weight: 700; }
        .reaction-chip .count { font-size: 0.65rem; color: #6b7280; }

        /* زر الريأكشن الافتراضي (قلب رمادي شفاف) */
        .add-reaction-btn {
            background: none; border: none; border-radius: 14px;
            padding: 1px 6px; font-size: 0.85rem; cursor: pointer;
            color: rgba(156, 163, 175, 0.5); transition: all 0.2s;
        }
        .add-reaction-btn:hover { color: #ef4444; opacity: 1; transform: scale(1.2); }

        /* ----- قائمة السياق ومنتقي الريأكشن ----- */
        .context-menu {
            position: fixed; background: white; border-radius: 14px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2); z-index: 200;
            padding: 6px; min-width: 160px;
        }
        .context-menu button {
            display: flex; align-items: center; gap: 8px; width: 100%;
            padding: 10px 14px; border: none; background: none; cursor: pointer;
            border-radius: 10px; font-family: 'Tajawal', sans-serif; font-size: 0.9rem;
        }
        .context-menu button:hover { background: #f3f4f6; }
        .context-menu button.danger { color: #ef4444; }
        .reaction-picker {
            position: fixed; background: white; border-radius: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2); z-index: 200;
            padding: 8px 14px; display: flex; gap: 8px; font-size: 1.5rem;
        }
        .reaction-picker span { cursor: pointer; transition: transform 0.15s; }
        .reaction-picker span:hover { transform: scale(1.4); }

        /* ----- شريط الإدخال (ثابت أسفل) ----- */
        .input-bar {
            background: white; border-top: 1px solid #e5e7eb;
            padding: 10px 12px; display: flex; align-items: center; gap: 8px;
            flex-shrink: 0; z-index: 20;
        }
        .input-bar .attach-btn {
            background: none; border: none; font-size: 1.5rem; cursor: pointer;
            padding: 6px 8px; border-radius: 50%; flex-shrink: 0;
        }
        .input-bar input[type="text"] {
            flex: 1; border: 1.5px solid #e5e7eb; border-radius: 22px;
            padding: 10px 16px; outline: none; font-family: 'Tajawal', sans-serif;
            font-size: 0.95rem; background: #fafafa;
        }
        .input-bar input[type="text"]:focus {
            border-color: #3b82f6; background: white;
        }
        .input-bar .send-btn {
            background: #2563eb; color: white; border: none;
            width: 42px; height: 42px; border-radius: 50%; font-size: 1.3rem;
            cursor: pointer; flex-shrink: 0;
        }

        /* ----- شريط الرد ----- */
        .reply-bar {
            background: #f0f7ff; border-top: 1px solid #bfdbfe;
            padding: 8px 14px; display: flex; align-items: center; gap: 10px;
            flex-shrink: 0; font-size: 0.85rem;
        }
        .reply-bar .cancel-reply {
            background: none; border: none; font-size: 1.2rem;
            cursor: pointer; color: #6b7280;
        }

        /* ----- معاينة الصورة ----- */
        .image-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 300;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .image-overlay img { max-width: 95vw; max-height: 90vh; border-radius: 8px; }

        .hidden { display: none !important; }

        @media (max-width: 640px) {
            .message-row { max-width: 90%; }
            .msg-image { max-width: 200px; max-height: 250px; }
        }
    </style>
</head>
<body>

<div class="chat-wrapper">
    <!-- الهيدر -->
    <header class="chat-header">
        <div class="header-left">
            <span id="connectionIndicator" class="connection-dot offline"></span>
            <div id="myAvatarContainer" class="avatar-circle" style="background:#4f46e5;">؟</div>
            <div>
                <div class="font-bold text-sm" id="headerTitle">💬 الدردشة</div>
                <div class="text-xs text-white/70" id="headerSubtitle">قناة اليمن اليوم</div>
            </div>
        </div>
        <div class="header-right">
            <button onclick="goBack()" class="back-btn">🗓️ التقويم</button>
        </div>
    </header>

    <!-- منطقة الرسائل -->
    <div id="messagesArea" class="messages-area"></div>

    <!-- شريط الرد -->
    <div id="replyBar" class="reply-bar hidden">
        <span>↩️ رد على: <strong id="replyTargetName"></strong></span>
        <span class="text-gray-500 text-xs" id="replyTargetPreview"></span>
        <button class="cancel-reply" onclick="cancelReply()">✕</button>
    </div>

    <!-- شريط الإدخال - ثابت أسفل -->
    <div class="input-bar">
        <button class="attach-btn" onclick="document.getElementById('imageInput').click()">🖼️</button>
        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
        <input type="text" id="messageInput" placeholder="اكتب رسالة..." autocomplete="off" autocorrect="off" spellcheck="false" dir="auto">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
</div>

<!-- قائمة السياق -->
<div id="contextMenu" class="context-menu hidden">
    <button onclick="contextAction('reply')">↩️ رد</button>
    <button onclick="contextAction('react')">😀 تفاعل</button>
    <button onclick="contextAction('edit')" id="ctxEditBtn">✏️ تعديل</button>
    <button onclick="contextAction('delete')" id="ctxDeleteBtn" class="danger">🗑️ حذف</button>
</div>

<!-- منتقي الريأكشن -->
<div id="reactionPicker" class="reaction-picker hidden">
    <span data-emoji="👍">👍</span>
    <span data-emoji="❤️">❤️</span>
    <span data-emoji="😂">😂</span>
    <span data-emoji="😮">😮</span>
    <span data-emoji="😢">😢</span>
    <span data-emoji="😡">😡</span>
</div>

<!-- معاينة الصورة -->
<div id="imageOverlay" class="image-overlay hidden" onclick="this.classList.add('hidden')">
    <img id="overlayImage" src="" alt="">
</div>

<script>
// ===== FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyCHd1yY27vSskKuvvNZ_XmtwgoHc3lPe5k",
  authDomain: "ytcalender-bae88.firebaseapp.com",
  databaseURL: "https://ytcalender-bae88-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ytcalender-bae88",
  storageBucket: "ytcalender-bae88.firebasestorage.app",
  messagingSenderId: "625139846676",
  appId: "1:625139846676:web:691be456f3f31e6572e101"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ===== المستخدم الحالي =====
let currentUser = null;
try { currentUser = JSON.parse(localStorage.getItem('currentUserForChat')); } catch(e) {}
if (!currentUser) {
    alert('الرجاء تسجيل الدخول من الصفحة الرئيسية أولاً');
    window.location.href = 'index.html';
}

// ===== ألوان الأفاتار لكل شخص =====
const userColors = {
    'زكريا': '#22c55e', 'منصور': '#f59e0b', 'محمد': '#3b82f6', 'نورا': '#ef4444',
    'اشرف': '#4f46e5', 'شرف': '#7c3aed'
};
function getUserColor(username) { return userColors[username] || '#6b7280'; }
function getUserInitial(username) { return username ? username.charAt(0) : '؟'; }

function createAvatarElement(username, size) {
    const div = document.createElement('div');
    div.className = size === 'small' ? 'msg-avatar' : 'avatar-circle';
    div.style.background = getUserColor(username);
    div.textContent = getUserInitial(username);
    div.title = username;
    return div;
}

// تحديث الهيدر
document.getElementById('headerTitle').textContent = '💬 ' + currentUser.username;
if (currentUser.role === 'admin') {
    document.getElementById('headerSubtitle').textContent = '👑 مشرف';
}
const myAvatarContainer = document.getElementById('myAvatarContainer');
myAvatarContainer.style.background = getUserColor(currentUser.username);
myAvatarContainer.textContent = getUserInitial(currentUser.username);

// ===== مؤشر الاتصال =====
firebase.database().ref(".info/connected").on("value", snap => {
    document.getElementById('connectionIndicator').className =
        'connection-dot ' + (snap.val() === true ? 'online' : 'offline');
});

// ===== العودة =====
function goBack() {
    if (window.opener && !window.opener.closed) { window.opener.focus(); window.close(); }
    else window.location.href = 'index.html';
}

// ===== المتغيرات =====
const messagesArea = document.getElementById('messagesArea');
const messageInput = document.getElementById('messageInput');
let replyTo = null, contextMessageKey = null, reactionTargetKey = null;
const loadedMessages = new Set();
let pendingImageData = null;

messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
});

// ===== تحميل الرسائل =====
db.ref('chat/general').on('child_added', snap => {
    if (loadedMessages.has(snap.key)) return;
    loadedMessages.add(snap.key);
    appendMessage(snap.key, snap.val());
    scrollToBottom();
});
db.ref('chat/general').on('child_changed', snap => {
    const el = document.getElementById('msg-' + snap.key);
    if (el) { el.remove(); loadedMessages.delete(snap.key); }
    appendMessage(snap.key, snap.val());
});
db.ref('chat/general').on('child_removed', snap => {
    const el = document.getElementById('msg-' + snap.key);
    if (el) { el.style.transition = 'all 0.3s'; el.style.opacity = '0'; el.style.transform = 'scale(0.8)'; setTimeout(() => el.remove(), 300); }
    loadedMessages.delete(snap.key);
});

// ===== إرسال =====
function sendMessage() {
    const text = messageInput.value.trim();
    if (!text && !pendingImageData) return;

    const message = {
        sender: currentUser.username, senderId: currentUser.id,
        time: new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' }),
        timestamp: firebase.database.ServerValue.TIMESTAMP,
        isAdmin: currentUser.role === 'admin', edited: false, reactions: {}
    };
    if (text) message.text = text;
    if (pendingImageData) { message.image = pendingImageData; pendingImageData = null; }
    if (replyTo) { message.replyTo = { key: replyTo.key, sender: replyTo.sender, text: replyTo.text }; cancelReply(); }

    db.ref('chat/general').push(message);
    messageInput.value = '';
}

function handleImageUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { alert('حجم الصورة كبير جداً (أقصى حد 5 ميجابايت)'); event.target.value = ''; return; }
    const reader = new FileReader();
    reader.onload = (e) => { pendingImageData = e.target.result; sendMessage(); };
    reader.readAsDataURL(file);
    event.target.value = '';
}

// ===== عرض رسالة =====
function appendMessage(key, msg) {
    if (document.getElementById('msg-' + key)) return;
    const isSent = msg.sender === currentUser.username;
    const row = document.createElement('div');
    row.className = `message-row ${isSent ? 'sent' : 'received'}`;
    row.id = 'msg-' + key;

    // أفاتار
    const avatar = createAvatarElement(msg.sender, 'small');
    row.appendChild(avatar);

    const content = document.createElement('div');
    content.className = 'msg-content';
    if (!isSent) {
        const nameDiv = document.createElement('div');
        nameDiv.className = 'msg-sender-name';
        nameDiv.textContent = msg.sender + (msg.isAdmin ? ' 👑' : '');
        content.appendChild(nameDiv);
    }

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    // رد
    if (msg.replyTo) {
        const rp = document.createElement('div');
        rp.className = 'reply-preview';
        rp.innerHTML = `<span class="reply-sender">${msg.replyTo.sender}</span><div class="reply-text">${msg.replyTo.text || '📷 صورة'}</div>`;
        rp.onclick = () => {
            const target = document.getElementById('msg-' + msg.replyTo.key);
            if (target) { target.scrollIntoView({ behavior: 'smooth', block: 'center' }); target.style.background = '#fef3c7'; setTimeout(() => target.style.background = '', 2000); }
        };
        bubble.appendChild(rp);
    }

    if (msg.text) {
        const textDiv = document.createElement('div');
        textDiv.className = 'msg-text' + (msg.edited ? ' edited-mark' : '');
        textDiv.textContent = msg.text;
        bubble.appendChild(textDiv);
    }
    if (msg.image) {
        const img = document.createElement('img');
        img.className = 'msg-image'; img.src = msg.image; img.loading = 'lazy';
        img.onclick = () => {
            document.getElementById('overlayImage').src = msg.image;
            document.getElementById('imageOverlay').classList.remove('hidden');
        };
        bubble.appendChild(img);
    }

    const timeDiv = document.createElement('div');
    timeDiv.className = 'msg-time';
    timeDiv.textContent = msg.time || '';
    const actionsBtn = document.createElement('button');
    actionsBtn.className = 'msg-actions-btn'; actionsBtn.innerHTML = '⋮';
    actionsBtn.onclick = (e) => { e.stopPropagation(); showContextMenu(e, key, msg); };
    timeDiv.appendChild(actionsBtn);
    bubble.appendChild(timeDiv);
    content.appendChild(bubble);

    // الريأكشنات
    const reactionsRow = document.createElement('div');
    reactionsRow.className = 'reactions-row';
    if (msg.reactions && Object.keys(msg.reactions).length > 0) {
        Object.entries(msg.reactions).forEach(([emoji, users]) => {
            if (users && users.length > 0) {
                const chip = document.createElement('span');
                chip.className = 'reaction-chip';
                if (users.includes(currentUser.username)) chip.classList.add('active');
                chip.innerHTML = `${emoji} <span class="count">${users.length}</span>`;
                chip.title = users.join('، ');
                chip.onclick = () => toggleReaction(key, emoji);
                reactionsRow.appendChild(chip);
            }
        });
    }
    // زر القلب الرمادي (يظهر دائماً)
    const addBtn = document.createElement('span');
    addBtn.className = 'add-reaction-btn';
    addBtn.innerHTML = '🤍';
    addBtn.title = 'إضافة تفاعل';
    addBtn.onclick = (e) => { e.stopPropagation(); showReactionPicker(e, key); };
    reactionsRow.appendChild(addBtn);
    content.appendChild(reactionsRow);

    // ضغط مطول
    bubble.addEventListener('contextmenu', (e) => { e.preventDefault(); showContextMenu(e, key, msg); });
    let timer;
    bubble.addEventListener('touchstart', () => { timer = setTimeout(() => { const ev = new Event('contextmenu'); bubble.dispatchEvent(ev); }, 600); });
    bubble.addEventListener('touchend', () => clearTimeout(timer));
    bubble.addEventListener('touchmove', () => clearTimeout(timer));

    row.appendChild(content);
    messagesArea.appendChild(row);
}

// ===== قائمة السياق =====
function showContextMenu(e, key, msg) {
    contextMessageKey = key;
    const menu = document.getElementById('contextMenu');
    document.getElementById('ctxEditBtn').classList.toggle('hidden', !((msg.sender === currentUser.username || currentUser.role === 'admin') && msg.text));
    document.getElementById('ctxDeleteBtn').classList.toggle('hidden', !(msg.sender === currentUser.username || currentUser.role === 'admin'));
    menu.classList.remove('hidden');
    let left = e.pageX || (e.touches && e.touches[0].pageX) || 100;
    let top = e.pageY || (e.touches && e.touches[0].pageY) || 200;
    if (left + 170 > window.innerWidth) left = window.innerWidth - 180;
    if (top + 200 > window.innerHeight) top = window.innerHeight - 210;
    menu.style.left = left + 'px'; menu.style.top = top + 'px';
}

function contextAction(action) {
    const key = contextMessageKey;
    document.getElementById('contextMenu').classList.add('hidden');
    if (!key) return;
    db.ref('chat/general/' + key).once('value', snap => {
        const msg = snap.val();
        if (!msg && action !== 'delete') return;
        switch(action) {
            case 'reply':
                replyTo = { key, sender: msg.sender, text: msg.text || '📷 صورة' };
                document.getElementById('replyBar').classList.remove('hidden');
                document.getElementById('replyTargetName').textContent = msg.sender;
                document.getElementById('replyTargetPreview').textContent = (msg.text || '📷 صورة').substring(0, 40);
                messageInput.focus();
                break;
            case 'react':
                reactionTargetKey = key;
                const el = document.getElementById('msg-' + key);
                if (el) {
                    const rect = el.getBoundingClientRect();
                    showReactionPicker({ pageX: rect.left + rect.width/2, pageY: rect.top }, key);
                }
                break;
            case 'edit':
                if (msg.text) {
                    const newText = prompt('تعديل الرسالة:', msg.text);
                    if (newText !== null && newText.trim() && newText.trim() !== msg.text) {
                        db.ref('chat/general/' + key).update({ text: newText.trim(), edited: true });
                    }
                }
                break;
            case 'delete':
                if (confirm('حذف هذه الرسالة؟')) db.ref('chat/general/' + key).remove();
                break;
        }
    });
}

// ===== الريأكشن =====
function showReactionPicker(e, key) {
    reactionTargetKey = key;
    const picker = document.getElementById('reactionPicker');
    picker.classList.remove('hidden');
    let left = e.pageX || 150, top = (e.pageY || 200) - 70;
    if (left + 220 > window.innerWidth) left = window.innerWidth - 230;
    if (top < 60) top = 60;
    picker.style.left = left + 'px'; picker.style.top = top + 'px';
}

function toggleReaction(key, emoji) {
    db.ref('chat/general/' + key + '/reactions/' + emoji).transaction(users => {
        if (!users) return [currentUser.username];
        if (Array.isArray(users)) {
            if (users.includes(currentUser.username)) {
                const filtered = users.filter(u => u !== currentUser.username);
                return filtered.length ? filtered : null;
            } else return [...users, currentUser.username];
        }
        return [currentUser.username];
    });
    document.getElementById('reactionPicker').classList.add('hidden');
}

document.querySelectorAll('#reactionPicker span').forEach(span => {
    span.addEventListener('click', () => toggleReaction(reactionTargetKey, span.dataset.emoji));
});

function cancelReply() {
    replyTo = null;
    document.getElementById('replyBar').classList.add('hidden');
}

document.addEventListener('click', (e) => {
    if (!e.target.closest('.context-menu') && !e.target.closest('.msg-actions-btn'))
        document.getElementById('contextMenu').classList.add('hidden');
    if (!e.target.closest('.reaction-picker') && !e.target.closest('.add-reaction-btn'))
        document.getElementById('reactionPicker').classList.add('hidden');
});

function scrollToBottom() {
    requestAnimationFrame(() => messagesArea.scrollTop = messagesArea.scrollHeight);
}
window.addEventListener('load', () => setTimeout(scrollToBottom, 500));
</script>
</body>
</html>
