<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الدردشة - قناة اليمن اليوم</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1d4ed8">
    <link rel="apple-touch-icon" href="images/icon-192x192.png">
    <script src="firebase-app.js"></script>
    <script src="firebase-database.js"></script>
    <script src="firebase-storage.js"></script>
    <script src="config.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js').then(function(r) { console.log('SW:', r.scope); }).catch(function(e) { console.log('SW failed:', e); });
            });
        }
    </script>
    <style>
        @import url('fonts.css');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #f0f2f5;
            height: 100dvh;
            overflow: hidden;
        }

        .chat-wrapper {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            box-shadow: 0 0 40px rgba(0,0,0,0.08);
            position: relative;
        }

        /* الهيدر */
        .chat-header {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 30;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .connection-dot {
            width: 10px; height: 10px; border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
        }
        .connection-dot.online { background: #22c55e; color: #22c55e; }
        .connection-dot.offline { background: #ef4444; color: #ef4444; }
        .avatar-circle {
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; color: white; border: 2px solid rgba(255,255,255,0.6);
            flex-shrink: 0;
        }
        .back-btn {
            background: rgba(255,255,255,0.15); border: none; color: white;
            padding: 8px 14px; border-radius: 20px; cursor: pointer;
            font-family: 'Tajawal', sans-serif;
        }

        /* منطقة الرسائل - flex:1 تأخذ كل المساحة المتبقية */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            background: #e8e8e8;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 0;
        }

        /* رسالة */
        .message-row { display: flex; gap: 8px; max-width: 85%; margin-bottom: 8px; animation: msgIn 0.3s ease; }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-row.sent { align-self: flex-end; flex-direction: row-reverse; }
        .message-row.received { align-self: flex-start; }
        .msg-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; color: white; flex-shrink: 0; margin-top: 4px;
        }
        .msg-content { display: flex; flex-direction: column; min-width: 60px; }
        .msg-sender-name { font-size: 0.7rem; font-weight: 700; color: #3b82f6; margin-bottom: 2px; }
        .msg-bubble {
            padding: 8px 14px; border-radius: 18px; word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }
        .sent .msg-bubble { background: #dcf8c6; border-bottom-right-radius: 4px; }
        .received .msg-bubble { background: white; border-bottom-left-radius: 4px; }
        .msg-text { font-size: 0.95rem; white-space: pre-wrap; }
        .msg-image { max-width: 200px; border-radius: 12px; cursor: pointer; margin: 4px 0; }
        .msg-time { font-size: 0.65rem; color: #8b8b8b; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
        .msg-actions-btn { opacity: 0; background: none; border: none; cursor: pointer; font-size: 1.1rem; }
        .msg-bubble:hover .msg-actions-btn { opacity: 1; }
        .reactions-row { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
        .reaction-chip {
            background: white; border: 1px solid #e5e7eb; border-radius: 14px;
            padding: 1px 8px; font-size: 0.75rem; cursor: pointer;
        }
        .reaction-chip.active { background: #dbeafe; border-color: #3b82f6; }
        .add-reaction-btn {
            background: none; border: none; font-size: 0.9rem; cursor: pointer;
            color: rgba(156,163,175,0.6);
        }

        /* شريط الرد */
        .reply-bar {
            background: #f0f7ff;
            border-top: 1px solid #bfdbfe;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            flex-shrink: 0;
            z-index: 25;
        }

        /* شريط الإدخال - ثابت في الأسفل */
        .input-bar {
            background: #ffffff;
            border-top: 2px solid #333333;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            z-index: 20;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
        }
        .input-bar input[type="text"] {
            flex: 1;
            border: 2px solid #333333;
            border-radius: 25px;
            padding: 10px 18px;
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            background: #ffffff;
            outline: none;
            min-width: 0;
        }
        .input-bar .send-btn {
            background: #2563eb;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="chat-wrapper">
    <!-- الهيدر -->
    <header class="chat-header">
        <div class="header-left">
            <span id="connectionIndicator" class="connection-dot offline"></span>
            <div id="myAvatarContainer" class="avatar-circle" style="background:#4f46e5;">؟</div>
            <div>
                <div class="font-bold text-sm" id="headerTitle">💬 الدردشة</div>
                <div class="text-xs text-white/70" id="headerSubtitle">قناة اليمن اليوم</div>
            </div>
        </div>
        <button class="back-btn" onclick="goBack()">🗓️ التقويم</button>
    </header>

    <!-- منطقة الرسائل -->
    <div id="messagesArea" class="messages-area">
        <div style="text-align:center;color:#9ca3af;padding:20px;">💬 لا توجد رسائل بعد.</div>
    </div>

    <!-- شريط الرد (يظهر عند الحاجة) -->
    <div id="replyBar" class="reply-bar hidden">
        <span>↩️ رد على: <strong id="replyTargetName"></strong></span>
        <span id="replyTargetPreview" style="color:#6b7280;font-size:0.8rem;"></span>
        <button style="margin-right:auto;background:none;border:none;font-size:1.2rem;cursor:pointer;" onclick="cancelReply()">✕</button>
    </div>

    <!-- شريط الإدخال (دائم الظهور) -->
    <div class="input-bar">
        <button style="font-size:1.5rem; background:none; border:none; cursor:pointer;" onclick="document.getElementById('imageInput').click()">🖼️</button>
        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
        <input type="text" id="messageInput" placeholder="اكتب رسالة..." autocomplete="off" autocorrect="off" spellcheck="false" dir="auto">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
</div>

<!-- بقية العناصر المخفية (قائمة السياق، الريأكشن، معاينة الصورة) -->
<div id="contextMenu" class="context-menu hidden" style="position:fixed;background:white;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,0.2);z-index:200;padding:6px;min-width:160px;">
    <button onclick="contextAction('reply')" style="display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;border:none;background:none;cursor:pointer;border-radius:10px;font-family:'Tajawal',sans-serif;font-size:0.9rem;text-align:right;">↩️ رد</button>
    <button onclick="contextAction('react')" style="display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;border:none;background:none;cursor:pointer;border-radius:10px;font-family:'Tajawal',sans-serif;font-size:0.9rem;text-align:right;">😀 تفاعل</button>
    <button onclick="contextAction('edit')" id="ctxEditBtn" style="display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;border:none;background:none;cursor:pointer;border-radius:10px;font-family:'Tajawal',sans-serif;font-size:0.9rem;text-align:right;">✏️ تعديل</button>
    <button onclick="contextAction('delete')" id="ctxDeleteBtn" class="danger" style="display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;border:none;background:none;cursor:pointer;border-radius:10px;font-family:'Tajawal',sans-serif;font-size:0.9rem;text-align:right;color:#ef4444;">🗑️ حذف</button>
</div>
<div id="reactionPicker" class="reaction-picker hidden" style="position:fixed;background:white;border-radius:30px;box-shadow:0 8px 25px rgba(0,0,0,0.2);z-index:200;padding:8px 14px;display:flex;gap:8px;font-size:1.5rem;">
    <span data-emoji="👍">👍</span>
    <span data-emoji="❤️">❤️</span>
    <span data-emoji="😂">😂</span>
    <span data-emoji="😮">😮</span>
    <span data-emoji="😢">😢</span>
    <span data-emoji="😡">😡</span>
</div>
<div id="imageOverlay" class="image-overlay hidden" onclick="this.classList.add('hidden')" style="position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:300;display:flex;align-items:center;justify-content:center;cursor:pointer;">
    <img id="overlayImage" src="" style="max-width:95vw;max-height:90vh;border-radius:8px;">
</div>

<script>
// ===== FIREBASE =====
firebase.initializeApp(APP_CONFIG.firebaseConfig);
const db = firebase.database();

// ===== المستخدمون: الثابتون في config.js + المستخدمون المضافون من الأدمن في Firebase =====
let USERS = Object.assign({}, APP_CONFIG.users);
(async function loadFirebaseUsers() {
    try {
        const snap = await db.ref('users').once('value');
        const fb = snap.val() || {};
        // دمج كامل: تحديث الهش من Firebase لجميع المستخدمين (حتى لو تغيّر في أي مكان)
        Object.keys(fb).forEach(function(u) {
            if (fb[u] && fb[u].passwordHash) {
                USERS[u] = { ...(APP_CONFIG.users[u] || fb[u]), ...fb[u] };
            }
        });
    } catch (e) {}
})();

// ===== معرف هذا الجهاز (لإهمال رسائله المرسلة من هنا)
function getDeviceId() {
    let id = localStorage.getItem('deviceId');
    if (!id) {
        const arr = new Uint8Array(16);
        crypto.getRandomValues(arr);
        id = Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
        localStorage.setItem('deviceId', id);
    }
    return id;
}

// ===== التحقق من الجلسة (متسامح مثل index.html — لا يفشل الجلسة بسبب شبكة بطيئة) =====
let currentUser = null;
(async function verifySession() {
    const saved = localStorage.getItem('currentUser');
    if (saved) {
        try {
            const parsed = JSON.parse(saved);
            if (!parsed.username) throw new Error('no username');
            // جلب أحدث بيانات المستخدم من Firebase (حتى لو تغيّرت كلمة المرور في index)
            let fbUser = null;
            try {
                const snap = await db.ref('users/' + parsed.username).once('value');
                fbUser = snap.val();
            } catch(e) {}
            const configUser = APP_CONFIG.users[parsed.username] || null;
            // الهش المفضّل = الأحدث بين Firebase وconfig.js
            const preferredHash = (fbUser && fbUser.passwordHash) || (configUser && configUser.passwordHash) || null;
            const u = USERS[parsed.username] || configUser || (fbUser ? fbUser : null);
            if (u) {
                const hashOk = preferredHash && parsed.passwordHash === preferredHash;
                if (hashOk) {
                    currentUser = { username: parsed.username, ...(configUser || {}), ...(fbUser || {}) };
                } else if (parsed.sessionToken) {
                    // تحقق من رمز الجلسة في Firebase
                    try {
                        const sess = await db.ref('sessions/' + parsed.username).once('value');
                        if (sess.val() && sess.val().sessionToken === parsed.sessionToken) {
                            currentUser = { username: parsed.username, ...(configUser || {}), ...(fbUser || {}) };
                        }
                    } catch(e) {}
                }
            }
        } catch(e) {}
    }
    if (!currentUser) {
        // فاصل قصير ثم إعادة المحاولة مرة أخيرة (شبكة بطيئة)
        await new Promise(r => setTimeout(r, 1500));
        if (!currentUser) {
            alert('انتهت الجلسة. الرجاء تسجيل الدخول من الصفحة الرئيسية.');
            window.location.href = 'index.html';
        }
    }
})();

const userColors = {
    'زكريا': '#22c55e', 'منصور': '#f59e0b', 'محمد': '#3b82f6', 'نورا': '#ef4444',
    'اشرف': '#4f46e5', 'شرف': '#7c3aed'
};
function getUserColor(u) { return userColors[u] || '#6b7280'; }
function getUserInitial(u) { return u ? u.charAt(0).toUpperCase() : '?'; }
function createAvatarElement(username, small) {
    const div = document.createElement('div');
    div.className = small ? 'msg-avatar' : 'avatar-circle';
    div.style.background = getUserColor(username);
    div.textContent = getUserInitial(username);
    div.title = username;
    return div;
}

// ===== الكاش المحلي (نمط واتساب): عرض الرسائل القديمة محليًا فورًا =====
const CACHE_VERSION = 2; // يُرفع مع كل تحديث رئيسي لصفحة الدردشة
const SAVED_VERSION = parseInt(localStorage.getItem('chatCacheVersion') || '0');
if (SAVED_VERSION < CACHE_VERSION) {
    localStorage.removeItem('chatCache');
    localStorage.setItem('chatCacheVersion', String(CACHE_VERSION));
}

// العناصر الأساسية (تُعرَّف هنا قبل أي استخدام لها)
const messagesArea = document.getElementById('messagesArea');
const messageInput = document.getElementById('messageInput');
let replyTo = null, contextMessageKey = null, reactionTargetKey = null;
const loadedMessages = new Set();

// عرض رسالة واحدة في المنطقة (تعريف مبكر)
function renderMessages() {
    // مسح placeholder القديم إن وجد
    try {
        const ph = messagesArea.querySelector('div');
        if (ph && ph.children.length === 0 && !ph.id) ph.remove();
    } catch(e) {}
    // ترتيب الكاش وإعادة رسم كل الرسائل (نمط واتساب: محلي أولاً)
    try {
        const cached = JSON.parse(localStorage.getItem('chatCache') || '[]');
        cached.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
        messagesArea.innerHTML = '';
        loadedMessages.clear();
        cached.forEach(m => {
            loadedMessages.add(m.key);
            appendMessage(m.key, m);
        });
        messagesArea.scrollTop = messagesArea.scrollHeight;
    } catch(e) {}
}

// جلب أحدث الرسائل من الشبكة وحفظها محليًا ثم العرض
function loadNetworkMessages() {
    db.ref('chat/general').orderByChild('timestamp').limitToLast(300).once('value', snap => {
        try {
            const val = snap.val() || {};
            const msgs = Object.entries(val).map(([k, v]) => ({ key: k, ...v }));
            if (msgs.length) {
                msgs.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                // حفظ الكاش (بدون صور base64 الثقيلة)
                const toSave = msgs.filter(m => !m.image).map(m => ({ key: m.key, sender: m.sender, senderId: m.senderId, deviceId: m.deviceId, time: m.time, timestamp: m.timestamp, text: m.text, edited: m.edited, reactions: m.reactions, replyTo: m.replyTo }));
                localStorage.setItem('chatCache', JSON.stringify(toSave.slice(-300)));
                renderMessages();
            }
        } catch(e) {}
    });
}

// 1) العرض الفوري من الكاش المحلي حتى قبل رد الشبكة (شبكة بطيئة/إشكالية)
renderMessages();
// 2) الجلب من الشبكة وتحديث الكاش
loadNetworkMessages();

if (currentUser) {
    document.getElementById('headerTitle').textContent = '💬 ' + currentUser.username;
    if (currentUser.role === 'admin') document.getElementById('headerSubtitle').textContent = '👑 مشرف';
    const myAvatar = document.getElementById('myAvatarContainer');
    myAvatar.style.background = getUserColor(currentUser.username);
    myAvatar.textContent = getUserInitial(currentUser.username);
}

firebase.database().ref(".info/connected").on("value", snap => {
    document.getElementById('connectionIndicator').className = 'connection-dot ' + (snap.val() ? 'online' : 'offline');
});

function goBack() {
    // تحديث العلامة المائية قبل الخروج: كل الرسائل التي شاهدناها في نافذة
    // الدردشة يجب ألا تُعدّ "جديدة" لاحقاً في الصفحة الرئيسية
    try {
        const session = JSON.parse(localStorage.getItem('currentUser') || '{}');
        if (session.username) {
            localStorage.setItem('lastChatTimestamp_' + session.username, String(Date.now()));
        }
    } catch(e) {}
    if (window.opener && !window.opener.closed) { window.opener.focus(); window.close(); }
    else window.location.href = 'index.html';
}

messageInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });

db.ref('chat/general').on('child_added', snap => {
    if (loadedMessages.has(snap.key)) return;
    loadedMessages.add(snap.key);
    const msg = snap.val();
    appendMessage(snap.key, msg);
    // تحديث الكاش المحلي
    try {
        const cached = JSON.parse(localStorage.getItem('chatCache') || '[]');
        const m = { key: snap.key, sender: msg.sender, senderId: msg.senderId, deviceId: msg.deviceId, time: msg.time, timestamp: msg.timestamp, text: msg.text, edited: msg.edited, reactions: msg.reactions, replyTo: msg.replyTo };
        cached.push(m);
        localStorage.setItem('chatCache', JSON.stringify(cached.slice(-300)));
    } catch(e) {}
    scrollToBottom();
    // تنبيه داخل صفحة الدردشة: صوت عند وصول رسالة من شخص آخر

db.ref('chat/general').on('child_changed', snap => {
    const el = document.getElementById('msg-'+snap.key);
    if (el) { el.remove(); loadedMessages.delete(snap.key); }
    appendMessage(snap.key, snap.val());
    // تحديث الرسالة في الكاش المحلي
    try {
        const cached = JSON.parse(localStorage.getItem('chatCache') || '[]');
        const i = cached.findIndex(m => m.key === snap.key);
        if (i >= 0) { cached[i] = { ...cached[i], text: snap.val().text, edited: snap.val().edited, reactions: snap.val().reactions, replyTo: snap.val().replyTo }; localStorage.setItem('chatCache', JSON.stringify(cached)); }
    } catch(e) {}
});
db.ref('chat/general').on('child_removed', snap => {
    const el = document.getElementById('msg-'+snap.key);
    if (el) { el.style.transition='all 0.3s'; el.style.opacity='0'; el.style.transform='scale(0.8)'; setTimeout(()=>el.remove(),300); }
    loadedMessages.delete(snap.key);
    // حذف الرسالة من الكاش المحلي
    try {
        const cached = JSON.parse(localStorage.getItem('chatCache') || '[]');
        const i = cached.findIndex(m => m.key === snap.key);
        if (i >= 0) { cached.splice(i, 1); localStorage.setItem('chatCache', JSON.stringify(cached)); }
    } catch(e) {}
});

// رفع الصور إلى Firebase Storage بدل تخزينها كـ Base64 في قاعدة البيانات
// (تجنب حد 5MB لكل رسالة وتسريع تحميل الدردشة)
const storage = firebase.storage();
let pendingImageData = null, pendingImageName = null;

async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text && !pendingImageData) return;
    if (!currentUser) return;

    let imageUrl = null;
    if (pendingImageData) {
        try {
            // إظهار حالة الرفع
            const sendBtn = document.querySelector('.send-btn');
            const prevText = sendBtn.textContent;
            sendBtn.textContent = '⏳';
            sendBtn.disabled = true;
            // رفع الصورة إلى Storage وتخزين الرابط فقط
            const ref = storage.ref('chat/' + currentUser.username + '/' + pendingImageName);
            const snapshot = await ref.putString(pendingImageData, 'data_url');
            imageUrl = await snapshot.ref.getDownloadURL();
            sendBtn.textContent = prevText;
            sendBtn.disabled = false;
        } catch(e) {
            alert('فشل رفع الصورة: ' + (e.message || e));
            return;
        }
    }
    pendingImageData = null; pendingImageName = null;

    const msg = {
        sender: currentUser.username, senderId: currentUser.id,
        deviceId: getDeviceId(),
        time: new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}),
        timestamp: firebase.database.ServerValue.TIMESTAMP,
        isAdmin: currentUser.role === 'admin', edited: false, reactions: {}
    };
    if (text) msg.text = text;
    if (imageUrl) msg.imageUrl = imageUrl;
    if (replyTo) { msg.replyTo = { key: replyTo.key, sender: replyTo.sender, text: replyTo.text }; cancelReply(); }
    db.ref('chat/general').push(msg);
    messageInput.value = '';
}

function handleImageUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 10*1024*1024) { alert('حجم الصورة كبير جداً (الحد الأقصى 10MB)'); return; }
    const reader = new FileReader();
    reader.onload = e => {
        pendingImageData = e.target.result;
        // اسم ملف فريد يمنع التعارض بين الصور المتشابهة
        pendingImageName = Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.' + (file.type.split('/')[1] || 'jpg');
        sendMessage();
    };
    reader.readAsDataURL(file);
    event.target.value = '';
}

function appendMessage(key, msg) {
    const placeholder = messagesArea.querySelector('div[style]');
    if (placeholder) placeholder.remove();
    if (document.getElementById('msg-'+key)) return;
    const isSent = msg.sender === currentUser.username;
    const row = document.createElement('div');
    row.className = 'message-row ' + (isSent ? 'sent' : 'received');
    row.id = 'msg-'+key;
    const avatar = createAvatarElement(msg.sender, true);
    const content = document.createElement('div');
    content.className = 'msg-content';
    if (!isSent) {
        const nameDiv = document.createElement('div');
        nameDiv.className = 'msg-sender-name';
        nameDiv.textContent = msg.sender + (msg.isAdmin ? ' 👑' : '');
        content.appendChild(nameDiv);
    }
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    if (msg.replyTo) {
        const rp = document.createElement('div');
        rp.style.cssText = 'background:rgba(0,0,0,0.06); border-radius:10px; padding:6px 10px; margin-bottom:6px; border-right:3px solid #3b82f6; font-size:0.8rem; cursor:pointer;';
        rp.innerHTML = `<span style="font-weight:700;color:#3b82f6;font-size:0.7rem;">${msg.replyTo.sender}</span><div style="color:#4b5563;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${msg.replyTo.text||'📷 صورة'}</div>`;
        rp.onclick = () => {
            const target = document.getElementById('msg-'+msg.replyTo.key);
            if (target) { target.scrollIntoView({behavior:'smooth',block:'center'}); target.style.background='#fef3c7'; setTimeout(()=>target.style.background='',2000); }
        };
        bubble.appendChild(rp);
    }
    if (msg.text) {
        const textDiv = document.createElement('div');
        textDiv.className = 'msg-text' + (msg.edited ? ' edited-mark' : '');
        textDiv.textContent = msg.text;
        bubble.appendChild(textDiv);
    }
    // دعم الصور القديمة (msg.image) والجديدة المخزنة في Storage (msg.imageUrl)
    if (msg.image || msg.imageUrl) {
        const src = msg.imageUrl || msg.image;
        const img = document.createElement('img');
        img.className = 'msg-image'; img.src = src; img.loading='lazy';
        img.onclick = () => { document.getElementById('overlayImage').src = src; document.getElementById('imageOverlay').classList.remove('hidden'); };
        bubble.appendChild(img);
    }
    const timeDiv = document.createElement('div');
    timeDiv.className = 'msg-time';
    timeDiv.textContent = msg.time || '';
    const btn = document.createElement('button');
    btn.className = 'msg-actions-btn'; btn.innerHTML = '⋮'; btn.title = 'خيارات';
    btn.onclick = e => { e.stopPropagation(); showContextMenu(e, key, msg); };
    timeDiv.appendChild(btn);
    bubble.appendChild(timeDiv);
    content.appendChild(bubble);
    const reactionsRow = document.createElement('div');
    reactionsRow.className = 'reactions-row';
    if (msg.reactions) {
        Object.entries(msg.reactions).forEach(([emoji, users]) => {
            if (users && users.length) {
                const chip = document.createElement('span');
                chip.className = 'reaction-chip';
                if (users.includes(currentUser.username)) chip.classList.add('active');
                chip.innerHTML = `${emoji} <span class="count">${users.length}</span>`;
                chip.title = users.join('، ');
                chip.onclick = () => toggleReaction(key, emoji);
                reactionsRow.appendChild(chip);
            }
        });
    }
    const addBtn = document.createElement('span');
    addBtn.className = 'add-reaction-btn'; addBtn.innerHTML = '🤍';
    addBtn.onclick = e => { e.stopPropagation(); showReactionPicker(e, key); };
    reactionsRow.appendChild(addBtn);
    content.appendChild(reactionsRow);
    bubble.addEventListener('contextmenu', e => { e.preventDefault(); showContextMenu(e, key, msg); });
    let timer;
    bubble.addEventListener('touchstart', () => { timer = setTimeout(() => bubble.dispatchEvent(new Event('contextmenu')), 600); });
    bubble.addEventListener('touchend', () => clearTimeout(timer));
    bubble.addEventListener('touchmove', () => clearTimeout(timer));
    row.appendChild(avatar);
    row.appendChild(content);
    messagesArea.appendChild(row);
}

function showContextMenu(e, key, msg) {
    contextMessageKey = key;
    const menu = document.getElementById('contextMenu');
    document.getElementById('ctxEditBtn').style.display = ((msg.sender === currentUser.username || currentUser.role==='admin') && msg.text) ? 'flex' : 'none';
    document.getElementById('ctxDeleteBtn').style.display = (msg.sender === currentUser.username || currentUser.role==='admin') ? 'flex' : 'none';
    menu.classList.remove('hidden');
    let left = e.pageX || 100, top = e.pageY || 200;
    if (left+170 > window.innerWidth) left = window.innerWidth-180;
    if (top+200 > window.innerHeight) top = window.innerHeight-210;
    menu.style.left = left+'px'; menu.style.top = top+'px';
}
function contextAction(action) {
    const key = contextMessageKey;
    document.getElementById('contextMenu').classList.add('hidden');
    if (!key) return;
    db.ref('chat/general/'+key).once('value', snap => {
        const msg = snap.val();
        if (!msg && action!=='delete') return;
        switch(action) {
            case 'reply':
                replyTo = { key, sender: msg.sender, text: msg.text || '📷 صورة' };
                document.getElementById('replyBar').classList.remove('hidden');
                document.getElementById('replyTargetName').textContent = msg.sender;
                document.getElementById('replyTargetPreview').textContent = (msg.text||'📷 صورة').substring(0,40);
                messageInput.focus();
                break;
            case 'react':
                reactionTargetKey = key;
                const el = document.getElementById('msg-'+key);
                if (el) { const rect = el.getBoundingClientRect(); showReactionPicker({ pageX: rect.left+rect.width/2, pageY: rect.top }, key); }
                break;
            case 'edit':
                if (msg.text) {
                    const t = prompt('تعديل الرسالة:', msg.text);
                    if (t && t.trim() && t.trim()!==msg.text) db.ref('chat/general/'+key).update({ text: t.trim(), edited: true });
                }
                break;
            case 'delete':
                if (confirm('حذف هذه الرسالة؟')) db.ref('chat/general/'+key).remove();
                break;
        }
    });
}
function showReactionPicker(e, key) {
    reactionTargetKey = key;
    const picker = document.getElementById('reactionPicker');
    picker.classList.remove('hidden');
    let left = e.pageX||150, top = (e.pageY||200)-70;
    if (left+220 > window.innerWidth) left = window.innerWidth-230;
    if (top<60) top=60;
    picker.style.left = left+'px'; picker.style.top = top+'px';
}
function toggleReaction(key, emoji) {
    db.ref('chat/general/'+key+'/reactions/'+emoji).transaction(users => {
        if (!users) return [currentUser.username];
        if (Array.isArray(users)) {
            if (users.includes(currentUser.username)) { const f = users.filter(u => u!==currentUser.username); return f.length ? f : null; }
            else return [...users, currentUser.username];
        }
        return [currentUser.username];
    });
    document.getElementById('reactionPicker').classList.add('hidden');
}
document.querySelectorAll('#reactionPicker span').forEach(s => s.addEventListener('click', () => toggleReaction(reactionTargetKey, s.dataset.emoji)));
function cancelReply() { replyTo = null; document.getElementById('replyBar').classList.add('hidden'); }
document.addEventListener('click', e => {
    if (!e.target.closest('.context-menu')) document.getElementById('contextMenu').classList.add('hidden');
    if (!e.target.closest('.reaction-picker')) document.getElementById('reactionPicker').classList.add('hidden');
});
function scrollToBottom() { messagesArea.scrollTop = messagesArea.scrollHeight; }
</script>
