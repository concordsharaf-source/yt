<script>
// ===== DISABLE FIREBASE FOR LOCAL TESTING =====
// استخدام بيانات محلية بدلاً من Firebase
let useLocalData = true;
const ADMIN_PASSWORD = "yemen2026";
let isAdmin = false;

const defaultEmployees = [
    { id: 1, name: 'زكريا', color: 'employee-1', grayColor: 'employee-1-gray', bgClass: 'employee-bg-1', grayBgClass: 'employee-bg-1-gray', image: '' },
    { id: 2, name: 'منصور', color: 'employee-2', grayColor: 'employee-2-gray', bgClass: 'employee-bg-2', grayBgClass: 'employee-bg-2-gray', image: '' },
    { id: 3, name: 'محمد', color: 'employee-3', grayColor: 'employee-3-gray', bgClass: 'employee-bg-3', grayBgClass: 'employee-bg-3-gray', image: '' },
    { id: 4, name: 'نورا', color: 'employee-4', grayColor: 'employee-4-gray', bgClass: 'employee-bg-4', grayBgClass: 'employee-bg-4-gray', image: '' }
];

let currentDate = new Date();
let selectedDay = null;
let employees = JSON.parse(JSON.stringify(defaultEmployees));
let shifts = {};
let swipeIndex = 1; // 0=prev, 1=current, 2=next
let touchStartX = 0;
let touchEndX = 0;

// بيانات محلية مخزنة
try {
    const savedShifts = localStorage.getItem('localShifts');
    if (savedShifts) {
        shifts = JSON.parse(savedShifts);
    }
} catch(e) {
    console.log('No saved shifts found');
}

const arabicMonths = [
'يناير','فبراير','مارس','أبريل','مايو','يونيو',
'يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'
];
const arabicDays = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

// ===== CHECK SAVED ADMIN SESSION =====
function checkAdminSession() {
    const saved = localStorage.getItem('adminLoggedIn');
    if (saved === 'true') {
        isAdmin = true;
        updateAdminUI();
        console.log('✅ Admin session restored');
    }
}

// ===== ADMIN =====
function handleSettingsClick() {
    if (isAdmin) { showPage('settings'); }
    else { openPasswordModal('settings'); }
}
function openPasswordModal(target) {
    document.getElementById('passwordModal').classList.remove('hidden');
    document.getElementById('passwordInput').value = '';
    document.getElementById('passwordInput').dataset.target = target;
    setTimeout(() => document.getElementById('passwordInput').focus(), 100);
}
function closePasswordModal() {
    document.getElementById('passwordModal').classList.add('hidden');
}
function verifyPassword() {
    const input = document.getElementById('passwordInput').value;
    const target = document.getElementById('passwordInput').dataset.target;
    if (input === ADMIN_PASSWORD) {
        isAdmin = true;
        localStorage.setItem('adminLoggedIn', 'true');
        closePasswordModal();
        updateAdminUI();
        if (target === 'settings') { showPage('settings'); }
        showToast('تم تسجيل الدخول كمسؤول', 'success');
    } else {
        showToast('كلمة المرور غير صحيحة', 'error');
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
    }
}
function logoutAdmin() {
    isAdmin = false;
    localStorage.removeItem('adminLoggedIn');
    updateAdminUI();
    showPage('calendar');
    showToast('تم تسجيل الخروج', 'success');
}
function updateAdminUI() {
    const logoutBtn = document.getElementById('logoutBtn');
    if (isAdmin) { logoutBtn.classList.remove('hidden'); }
    else { logoutBtn.classList.add('hidden'); }
}

// ===== PAGES =====
function showPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
    const targetPage = document.getElementById(page + 'Page');
    if (targetPage) {
        targetPage.classList.remove('hidden');
    }
    document.querySelectorAll('.nav-btn').forEach(btn => {
        if (btn.dataset.page === page) {
            btn.classList.add('bg-white/20');
        } else {
            btn.classList.remove('bg-white/20');
        }
    });
    if (page === 'stats') renderStats();
    if (page === 'calendar') {
        renderCalendar();
        renderMobileDayView();
    }
}

// ===== SHIFT LOGIC =====
function getEmployeeForDate(date) {
    const startDate = new Date(2026, 7, 1);
    const currentDay = new Date(date);
    const dayOfWeek = currentDay.getDay();
    const key = `${currentDay.getFullYear()}-${currentDay.getMonth()+1}-${currentDay.getDate()}`;
    if (shifts[key]) {
        return employees.find(e => e.id === shifts[key]) || null;
    }
    let employeeId = null;
    if (dayOfWeek === 6) { employeeId = 1; }
    else if (dayOfWeek === 0) { employeeId = 2; }
    else if (dayOfWeek === 1) { employeeId = 3; }
    else if (dayOfWeek === 2) { employeeId = 4; }
    else if (dayOfWeek === 3) {
        let count = 0;
        let temp = new Date(startDate);
        while (temp <= currentDay) {
            if (temp.getDay() === 3) count++;
            temp.setDate(temp.getDate() + 1);
        }
        employeeId = (count % 2 === 1) ? 1 : 4;
    }
    else if (dayOfWeek === 4) {
        let count = 0;
        let temp = new Date(startDate);
        while (temp <= currentDay) {
            if (temp.getDay() === 4) count++;
            temp.setDate(temp.getDate() + 1);
        }
        employeeId = (count % 2 === 1) ? 3 : 2;
    }
    else if (dayOfWeek === 5) {
        let count = 0;
        let temp = new Date(startDate);
        while (temp <= currentDay) {
            if (temp.getDay() === 5) count++;
            temp.setDate(temp.getDate() + 1);
        }
        let mod = count % 4;
        if (mod === 1) employeeId = 4;
        else if (mod === 2) employeeId = 2;
        else if (mod === 3) employeeId = 1;
        else employeeId = 3;
    }
    return employees.find(e => e.id === employeeId) || null;
}

function getDateOffset(offset) {
    const d = new Date(currentDate);
    d.setDate(d.getDate() + offset);
    return d;
}

// ===== RENDER MOBILE DAY VIEW WITH SWIPE =====
function renderMobileDayView() {
    const slides = ['prevDaySlide', 'currentDaySlide', 'nextDaySlide'];
    const offsets = [-1, 0, 1];
    
    slides.forEach((slideId, index) => {
        const slide = document.getElementById(slideId);
        if (!slide) return;
        const date = getDateOffset(offsets[index]);
        const employee = getEmployeeForDate(date);
        const isToday = isSameDay(date, new Date());
        const dayNum = date.getDate();
        const monthName = arabicMonths[date.getMonth()];
        const year = date.getFullYear();
        const dayName = arabicDays[date.getDay()];
        
        const isCurrentDay = offsets[index] === 0;
        const isPast = offsets[index] < 0;
        const isFuture = offsets[index] > 0;
        
        let colorClass = '';
        let bgClass = '';
        let cardBgClass = '';
        
        if (employee) {
            if (isCurrentDay) {
                colorClass = employee.color;
                bgClass = employee.bgClass;
                cardBgClass = employee.bgClass;
            } else {
                colorClass = employee.grayColor;
                bgClass = employee.grayBgClass;
                cardBgClass = employee.grayBgClass;
            }
        }
        
        slide.innerHTML = `
            <div class="w-full h-full flex flex-col justify-center items-center relative ${cardBgClass || 'bg-gray-900'} rounded-3xl p-8" style="min-height: 80vh;">
                <div class="absolute top-6 left-6 bg-white/20 backdrop-blur-md rounded-3xl p-4 border border-white/30 shadow-2xl">
                    ${employee ? `
                        <div class="w-24 h-24 rounded-full border-4 border-white/60 shadow-xl flex items-center justify-center ${colorClass || 'bg-gray-600'} text-4xl font-bold">
                            ${employee.name.charAt(0)}
                        </div>
                        <p class="text-white text-center text-base font-bold mt-3">${employee.name}</p>
                    ` : `
                        <div class="w-24 h-24 rounded-full bg-white/10 border-4 border-white/30 flex items-center justify-center">
                            <span class="text-white text-4xl">?</span>
                        </div>
                    `}
                </div>
                <div class="text-center mt-8">
                    <div class="text-[100px] font-extrabold text-white drop-shadow-2xl leading-none mb-2">${dayNum}</div>
                    <div class="text-3xl text-white/90 font-bold mb-4">${monthName} ${year}</div>
                    <div class="text-2xl text-white/80 mb-10">${dayName}</div>
                    ${employee ? `
                        <div class="inline-block px-10 py-5 rounded-3xl text-4xl font-extrabold shadow-2xl ${isCurrentDay ? 'pulse-ring' : ''} ${colorClass}">
                            ${employee.name}
                        </div>
                    ` : `
                        <div class="inline-block px-10 py-5 rounded-3xl text-3xl font-bold shadow-2xl bg-gray-500 text-white">
                            لا يوجد تعيين
                        </div>
                    `}
                </div>
                ${isPast ? `<div class="absolute bottom-4 text-white/40 text-sm">📅 يوم سابق</div>` : ''}
                ${isFuture ? `<div class="absolute bottom-4 text-white/40 text-sm">📅 يوم قادم</div>` : ''}
                ${isToday ? `<div class="absolute bottom-4 text-yellow-300 text-sm font-bold">⭐ اليوم</div>` : ''}
            </div>
        `;
    });
    
    // Update dots
    document.querySelectorAll('[id^="dot"]').forEach((dot, i) => {
        if (i === swipeIndex) {
            dot.className = 'w-2 h-2 rounded-full bg-white/70';
        } else {
            dot.className = 'w-2 h-2 rounded-full bg-white/30';
        }
    });
    
    // Update container position
    const container = document.getElementById('swipeContainer');
    if (container) {
        container.style.transform = `translateX(-${swipeIndex * 33.333}%)`;
    }
}

function isSameDay(d1, d2) {
    return d1.getFullYear() === d2.getFullYear() &&
           d1.getMonth() === d2.getMonth() &&
           d1.getDate() === d2.getDate();
}

// ===== SWIPE FUNCTIONS =====
function swipeLeft() {
    if (swipeIndex > 0) {
        swipeIndex--;
        const newDate = new Date(currentDate);
        newDate.setDate(newDate.getDate() - 1);
        currentDate = newDate;
        renderMobileDayView();
    }
}

function swipeRight() {
    if (swipeIndex < 2) {
        swipeIndex++;
        const newDate = new Date(currentDate);
        newDate.setDate(newDate.getDate() + 1);
        currentDate = newDate;
        renderMobileDayView();
    }
}

// Touch events for swipe
document.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('swipeContainer');
    if (container) {
        container.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        
        container.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });
    }
});

function handleSwipe() {
    const threshold = 50;
    const diff = touchStartX - touchEndX;
    
    if (Math.abs(diff) > threshold) {
        if (diff > 0 && swipeIndex < 2) {
            swipeRight();
        } else if (diff < 0 && swipeIndex > 0) {
            swipeLeft();
        }
    }
}

// ===== RENDER CALENDAR (DESKTOP) =====
function autoFillMonth() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const startDate = new Date(2026, 7, 1);
    let changed = false;
    for (let day = 1; day <= daysInMonth; day++) {
        const currentDay = new Date(year, month, day);
        let employee = null;
        const dayOfWeek = currentDay.getDay();
        if (dayOfWeek === 6) { employee = 1; }
        else if (dayOfWeek === 0) { employee = 2; }
        else if (dayOfWeek === 1) { employee = 3; }
        else if (dayOfWeek === 2) { employee = 4; }
        else if (dayOfWeek === 3) {
            let count = 0;
            let temp = new Date(startDate);
            while (temp <= currentDay) {
                if (temp.getDay() === 3) count++;
                temp.setDate(temp.getDate() + 1);
            }
            employee = (count % 2 === 1) ? 1 : 4;
        }
        else if (dayOfWeek === 4) {
            let count = 0;
            let temp = new Date(startDate);
            while (temp <= currentDay) {
                if (temp.getDay() === 4) count++;
                temp.setDate(temp.getDate() + 1);
            }
            employee = (count % 2 === 1) ? 3 : 2;
        }
        else if (dayOfWeek === 5) {
            let count = 0;
            let temp = new Date(startDate);
            while (temp <= currentDay) {
                if (temp.getDay() === 5) count++;
                temp.setDate(temp.getDate() + 1);
            }
            let mod = count % 4;
            if (mod === 1) employee = 4;
            else if (mod === 2) employee = 2;
            else if (mod === 3) employee = 1;
            else employee = 3;
        }
        if (employee) {
            const key = `${year}-${month+1}-${day}`;
            if (!shifts[key]) {
                shifts[key] = employee;
                changed = true;
            }
        }
    }
    if (changed) {
        saveLocalShifts();
    }
}

function saveLocalShifts() {
    try {
        localStorage.setItem('localShifts', JSON.stringify(shifts));
    } catch(e) {
        console.log('Could not save shifts locally');
    }
}

function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const el = document.getElementById('currentMonth');
    if (el) el.textContent = `${arabicMonths[month]} ${year}`;
    autoFillMonth();
    const grid = document.getElementById('calendarGrid');
    if (!grid) return;
    grid.innerHTML = '';
    const firstDay = (new Date(year, month, 1).getDay() + 1) % 7;
    const days = new Date(year, month+1, 0).getDate();
    const today = new Date();
    const isCurrentMonth = (today.getFullYear() === year && today.getMonth() === month);
    for (let i = 0; i < firstDay; i++) {
        let empty = document.createElement('div');
        empty.className = 'bg-gray-50 min-h-[90px]';
        grid.appendChild(empty);
    }
    for (let day = 1; day <= days; day++) {
        const key = `${year}-${month+1}-${day}`;
        const empId = shifts[key];
        const employee = employees.find(e => e.id === empId);
        const isToday = isCurrentMonth && day === today.getDate();
        let cellClasses = 'min-h-[90px] p-2 ';
        if (employee) { 
            cellClasses += (isToday ? employee.color : employee.grayColor) + ' ';
        } else { cellClasses += 'bg-white '; }
        if (isToday) { cellClasses += 'today-highlight '; }
        if (isAdmin) { cellClasses += 'cursor-pointer '; }
        let cell = document.createElement('div');
        cell.className = cellClasses;
        if (isAdmin) {
            cell.onclick = () => openModal(day);
        }
        let number = document.createElement('div');
        number.className = employee ? 'text-white font-bold' : 'font-bold text-gray-800';
        number.textContent = day;
        cell.appendChild(number);
        if (employee) {
            let name = document.createElement('div');
            name.className = 'text-white mt-2 text-xl font-bold';
            name.textContent = employee.name;
            cell.appendChild(name);
        }
        grid.appendChild(cell);
    }
}

function renderLegend() {
    const container = document.getElementById('legendContainer');
    if (container) container.innerHTML = employees.map(e => `
        <div class="flex items-center gap-2">
            <div class="w-4 h-4 rounded ${e.color}"></div>
            <span>${e.name}</span>
        </div>
    `).join('');
}

function previousMonth() {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
}
function nextMonth() {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
}

function openModal(day) {
    selectedDay = day;
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    document.getElementById('selectedDateText').textContent = `${day} ${arabicMonths[month]} ${year}`;
    document.getElementById('employeeOptions').innerHTML = employees.map(e => `
        <button onclick="assignEmployee(${e.id})" class="w-full p-3 rounded-lg ${e.color}">${e.name}</button>
    `).join('');
    document.getElementById('employeeModal').classList.remove('hidden');
}
function closeModal() {
    document.getElementById('employeeModal').classList.add('hidden');
    selectedDay = null;
}

function assignEmployee(id) {
    const key = `${currentDate.getFullYear()}-${currentDate.getMonth()+1}-${selectedDay}`;
    shifts[key] = id;
    saveLocalShifts();
    renderCalendar();
    renderMobileDayView();
    closeModal();
    showToast('تم تعديل الوردية', 'success');
}

function clearAssignment() {
    const key = `${currentDate.getFullYear()}-${currentDate.getMonth()+1}-${selectedDay}`;
    delete shifts[key];
    saveLocalShifts();
    renderCalendar();
    renderMobileDayView();
    closeModal();
    showToast('تم حذف الوردية', 'success');
}

function renderStats() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const el = document.getElementById('statsMonth');
    if (el) el.textContent = `إحصائيات شهر ${arabicMonths[month]} ${year}`;
    let counts = {};
    employees.forEach(e => counts[e.id] = 0);
    const prefix = `${year}-${month+1}-`;
    Object.entries(shifts).forEach(([key, id]) => {
        if (key.startsWith(prefix) && counts[id] !== undefined) { counts[id]++; }
    });
    const container = document.getElementById('statsContainer');
    if (container) container.innerHTML = employees.map(e => `
        <div class="p-4 rounded-lg ${e.color} text-white flex justify-between items-center">
            <span class="font-bold text-lg">${e.name}</span>
            <span class="text-2xl font-bold">${counts[e.id]} وردية</span>
        </div>
    `).join('');
}

function renderSettings() {
    const container = document.getElementById('settingsContainer');
    if (container) container.innerHTML = employees.map((e, i) => `
        <input id="emp${i}" value="${e.name}" class="w-full p-3 border rounded-lg" ${!isAdmin ? 'disabled' : ''}>
    `).join('');
}

function saveSettings() {
    if (!isAdmin) { showToast('يجب تسجيل الدخول أولاً', 'error'); return; }
    employees.forEach((e, i) => { e.name = document.getElementById('emp' + i).value; });
    renderCalendar();
    renderLegend();
    renderMobileDayView();
    showToast('تم الحفظ', 'success');
}

function showToast(message, type='success') {
    const existing = document.getElementById('toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.id = 'toast';
    toast.className = 'fixed bottom-6 right-6 transform transition-all duration-300 z-50';
    toast.innerHTML = `
        <div class="${type === 'success' ? 'bg-gray-800' : 'bg-red-600'} text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3">
            <span>${type === 'success' ? '✅' : '❌'}</span>
            <span class="font-medium text-sm">${message}</span>
        </div>
    `;
    document.body.appendChild(toast);
    requestAnimationFrame(() => { toast.style.transform = 'translateY(0)'; toast.style.opacity = '1'; });
    setTimeout(() => {
        toast.style.transform = 'translateY(20px)';
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !document.getElementById('passwordModal').classList.contains('hidden')) {
        verifyPassword();
    }
});

// Keyboard navigation for swipe
document.addEventListener('keydown', (e) => {
    const mobileView = document.getElementById('mobileDayView');
    if (mobileView && !mobileView.classList.contains('hidden')) {
        if (e.key === 'ArrowRight') {
            swipeRight();
        } else if (e.key === 'ArrowLeft') {
            swipeLeft();
        }
    }
});

// ===== INITIALIZATION =====
function init() {
    checkAdminSession();
    showPage('calendar');
    renderCalendar();
    renderLegend();
    renderMobileDayView();
    renderStats();
    renderSettings();
    console.log('✅ Application initialized successfully!');
}

// Run when DOM is ready
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>
</body>
</html>
